# Baut das Spiel mit build.py und veröffentlicht dist/ auf GitHub Pages.
# Deployment über den Branch "gh-pages": GitHub schaltet Pages für diesen Branch automatisch frei
# (Repo-Einstellungen → Pages → Source "Deploy from a branch", Branch gh-pages, Ordner /).
name: GitHub Pages

on:
  push:
    branches: [main, claude/scrum-pi-planning-game-ion8x3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Spiel bauen
        run: python3 build.py
        env:
          # Optional: Firebase-URL als Repo-Variable (Settings → Secrets and variables → Actions → Variables), sonst tracking.json
          TRACK_DB: ${{ vars.TRACK_DB }}
      - name: Auf gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
