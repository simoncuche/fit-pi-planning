die Klingel gefunden?": "Did you find the doorbell?", "Mittagessen ist bestellt.": "Lunch is ordered.", "Ich organisiere, ihr plant.": "I organise, you plan.", "Hilfe anbieten": "Offer help", "Heute ist alles organisiert. Danke!": "Everything is organised today. Thanks!", "Kannst du die Stühle in den Aufenthaltsraum tragen? Danke! Du bist der Erste, der fragt.": "Can you carry the chairs into the lounge? Thanks! You're the first to ask.", "Die Paella-Bestellung: 22 Portionen, zwei Vegetarier, ein Chris, der alles isst. Erledigt.": "The paella order: 22 portions, two vegetarians, one Chris who eats everything. Done.", "Hilf mir mit den Namensschildern – Robin hat seines im Hotel gelassen.": "Help me with the name tags – Robin left his at the hotel.", "Die Klingel": "The doorbell", "Sie steht nicht dran. „C.B. Soluciones, 1º B“. Juanjo findet das lustig. Ich nicht. Aber ich lasse es so.": "It's not on it. \"C.B. Soluciones, 1º B\". Juanjo thinks it's funny. I don't. But I leave it that way.", "Spesen": "Expenses", "Quittungen sammeln, Foto schicken, fertig. Nicht wie Luigi, der die Kart-Rechnung als „Teambuilding“ einreicht.": "Collect receipts, send a photo, done. Not like Luigi, who submits the kart bill as \"team building\".", "Frühstück gibt es von 7 bis 10:30.": "Breakfast is served from 7 to 10:30.", "Sie haben heute schon gefrühstückt. Ein Kaffee geht immer.": "You've already had breakfast today. A coffee always works.", "Zu wenig Geld.": "Not enough money.", "Ein Krug für den Tisch. {0}": "A jug for the table. {0}", " prosten dir zu.": " raise their glasses to you.", "Du trinkst ihn allein. Respekt.": "You drink it alone. Respect.", "Angezogen: {0}": "Wearing: {0}", "In die Tasche: {0}": "Into the bag: {0}", "<em>Battery Pass – Kurzfassung (Lukas)</em>: Ab 2027 braucht jede Industrie- und E-Bike-Batterie über 2 kWh einen digitalen Produktpass. QR-Code, Daten zu Herkunft, Kapazität, CO₂ und Zustand. Seite 2 bis 40: Tabellen.": "<em>Battery Pass – summary (Lukas)</em>: From 2027 every industrial and e-bike battery over 2 kWh needs a digital product passport. QR code, data on origin, capacity, CO₂ and condition. Pages 2 to 40: tables.", "<em>Frans Spickzettel</em>: 0x1017 Heartbeat · 0x6040 Controlword · 0x6060 Battery SOC · 0x6064 Geschwindigkeit · 0x6070 Motortemperatur · 0x6080 Battery SOH · 0x6090 Assist Level · 0x60A0 Fehlercode.": "<em>Fran's cheat sheet</em>: 0x1017 Heartbeat · 0x6040 Controlword · 0x6060 Battery SOC · 0x6064 Speed · 0x6070 Motor temperature · 0x6080 Battery SOH · 0x6090 Assist level · 0x60A0 Error code.", "17:00 – die anderen sind in der Bar Pepita (Plaza de la Virgen).": "17:00 – the others are at Bar Pepita (Plaza de la Virgen).", "9:15 – Kickoff in 15 Minuten im Aufenthaltsraum bei Colba!": "9:15 – kickoff in 15 minutes in the lounge at Colba!", "Gleich Mittag: {0} im Aufenthaltsraum.": "Almost lunchtime: {0} in the lounge.", "Final-Präsentation um 15:00 im Aufenthaltsraum!": "Final presentation at 15:00 in the lounge!", "Das war zu viel Agua de Valencia. Oder zu wenig Paella.": "That was too much Agua de Valencia. Or too little paella.", "Ein Passant: „¡Madre mía!“ Du: „Lo siento.“": "A passer-by: \"¡Madre mía!\" You: \"Lo siento.\"", "Der Boden hat jetzt eine Erinnerung an dich.": "The ground now has a memory of you.", "Filmriss …": "Blackout …", "{0}, {1}. Du wachst im Zimmer 412 auf, in Kleidern. Das Portemonnaie ist 30 € leichter, das Handy zeigt ein Foto von dir mit einem Ninot. Kater. {2}": "{0}, {1}. You wake up in room 412, fully dressed. Your wallet is 30 € lighter, your phone shows a photo of you with a ninot. Hangover. {2}", "Und du bist spät dran fürs Planning.": "And you're late for the planning.", "Du kannst kaum noch die Augen offen halten – ins Hotel, schnell.": "You can barely keep your eyes open – to the hotel, quickly.", "Zzz …": "Zzz …", "Du bist auf einer Bank eingeschlafen. {0} hat dich ins Hotel gebracht. Es ist {1}.": "You fell asleep on a bench. {0} brought you to the hotel. It's {1}.", "Ein Polizist": "A police officer", "Eine Fallera": "A fallera", "Eingeschlafen, in Kleidern, mit Laptop. Drei Stunden später.": "Fell asleep, dressed, with laptop. Three hours later.", "Samstag, 10:00 – Boarding …": "Saturday, 10:00 – boarding …", "Zum Flughafen …": "To the airport …", "VLC → ZRH": "VLC → ZRH", "Legendär – Juanjo will dich einstellen.": "Legendary – Juanjo wants to hire you.", "Stark – ein Plan, auf den man committen kann.": "Strong – a plan you can commit to.", "Okay – das halbe Jahr wird spannend.": "Okay – the half year will be exciting.", "Naja – aber Valencia war schön.": "Well – but Valencia was lovely.", "14:00 · Plaza del Ayuntamiento": "14:00 · Plaza del Ayuntamiento", "Ohren zu!": "Cover your ears!", "Boom. Boom. BOOM.": "Boom. Boom. BOOM.", "Fünf Minuten Böller, 120 Dezibel, der Boden bebt. Die Valencianer stehen mit offenem Mund da – damit die Ohren den Druck ausgleichen. Jetzt weisst du es auch.": "Five minutes of firecrackers, 120 decibels, the ground shakes. The Valencians stand there with their mouths open – so the ears can equalise the pressure. Now you know too.", "Mascletà! Eine Mutter hält ihrem Baby die Ohren zu, ein Opa lächelt selig. Der Rauch riecht nach Schiesspulver und Churros.": "Mascletà! A mother covers her baby's ears, a grandpa smiles blissfully. The smoke smells of gunpowder and churros.", "Ist das … normal hier? Jeden Tag? Ich dachte, das Hochhaus stürzt ein.": "Is that … normal here? Every day? I thought the tower was collapsing.", "Donnerstag 22:00": "Thursday 22:00", "La Cremà": "La Cremà", "Die Fallas brennen": "The Fallas burn", "Feuer, Funken, Blaskapelle.": "Fire, sparks, brass band.", "Um Mitternacht brennt die grosse Falla auf der Plaza del Ayuntamiento. Monate Arbeit, in zwanzig Minuten Asche – die Feuerwehr spritzt die Fassaden nass, die Kapelle spielt, und alle weinen ein bisschen. Morgen früh ist der Platz gefegt, als wäre nichts gewesen.": "At midnight the big falla on Plaza del Ayuntamiento burns. Months of work, ashes in twenty minutes – the fire brigade hoses down the facades, the band plays, and everyone cries a little. Tomorrow morning the square is swept as if nothing had happened.", "Das ist Valencia: bauen, feiern, verbrennen, von vorne.": "That's Valencia: build, celebrate, burn, start again.", "Nächstes Jahr kommt ihr wieder. Zur ganzen Woche.": "Next year you'll come back. For the whole week.", "Jetzt Churros. Und dann ins Bett – morgen ist Final.": "Churros now. And then to bed – the final is tomorrow.", "Entschuldige – wo ist nochmal der Aufenthaltsraum? Ich war im Lift, und dann war ich im Keller.": "Sorry – where's the lounge again? I was in the lift, and then I was in the basement.", "Welcher Raum ist Indurain? Ich bin dreimal an Rocket vorbeigelaufen.": "Which room is Indurain? I've walked past Rocket three times.", "Gibt es hier ein WC, das nicht abgeschlossen ist?": "Is there a toilet here that isn't locked?", "Keine Zeit": "No time", "Danke! Ich sollte mir einen Plan zeichnen. Das wäre ironisch.": "Thanks! I should draw myself a plan. That would be ironic.", "Du bist ein Schatz. Ich erwähne das beim nächsten Gehaltsgespräch. Deinem.": "You're a treasure. I'll mention it at the next salary review. Yours.", "Verstehe. Ich frag Isabel. Wo ist Isabel?": "I see. I'll ask Isabel. Where is Isabel?", "Wetter": "Weather", "Platzregen aus dem Nichts": "Downpour out of nowhere", "Von null auf Wolkenbruch in dreissig Sekunden. Die Valencianer rennen unter die Arkaden, die Touristen fotografieren. Du wirst nass. Sehr nass.": "From nothing to cloudburst in thirty seconds. The Valencians run under the arcades, the tourists take photos. You get wet. Very wet.", "Fallas": "Fallas", "Ofrenda-Umzug": "Ofrenda parade", "Falleras und Blaskapelle": "Falleras and brass band", "Fallera": "Fallera", "Eine Falla-Kommission zieht vorbei: Falleras in Seide, Brokat und mit Haarschnecken, dahinter die Blaskapelle mit „Paquito el Chocolatero“. Jede Falla b y{0}\"><div class=\"cl-head\"><b>Version {1}</b><span>{2}{3}</span></div><ul>{4}</ul></div>", " · aktuell": " · current", "<div class=\"sunball\" aria-hidden=\"true\"></div><div class=\"skyline\" aria-hidden=\"true\">{0}</div><div class=\"waves\" aria-hidden=\"true\"></div>\n  <div class=\"title-card\"><div class=\"boarding\">\n    <div class=\"bp-head\"><span>Boarding Pass · Economy</span><b>PI 2026-11</b></div>\n    <div class=\"bp-body\">\n      <h1 class=\"title-name\">Fit PI Planning <span>The Game</span></h1>\n      <div class=\"bp-route\"><div><small>Von</small><b>ZRH</b></div><span class=\"plane\">✈</span><div><small>Nach</small><b>VLC</b></div></div>\n      <div class=\"bp-grid\"><div><small>Datum</small><b>02.11.2026</b></div><div><small>Gate</small><b>B42</b></div><div><small>Sitz</small><b>14A</b></div><div><small>Ziel</small><b>Colba, 1. Stock</b></div></div>\n      <p class=\"title-sub\">Fünf Tage, drei Teams, ein Plan. Flieg mit den POs nach Valencia, finde den Koffer, das Hotel Kramer und die richtige Klingel am Colba-Hochhaus. Plane mit Indurain, Meeseeks und Rocket das nächste halbe Jahr – und erleb dazwischen Paella, Mestalla, Kartbahn, Segeltörn und E-Bike-Ausfahrten.</p>\n      <div class=\"title-btns\">\n        {1}\n        {2}\n        <button class=\"btn {3}\" id=\"tNew\">{4}</button>\n      </div>\n    </div>\n    <div class=\"bp-tear\"></div>\n    <div class=\"keys\">Tastatur: <kbd>WASD</kbd>/<kbd>Pfeile</kbd> gehen · <kbd>Shift</kbd> rennen · <kbd>E</kbd> Aktion · <kbd>M</kbd> Handy · <kbd>P</kbd> Foto. Am Handy: links ziehen zum Gehen, <kbd>A</kbd> für Aktionen. Läuft komplett im Browser, Spielstand bleibt auf diesem Gerät.</div>\n    <div class=\"barcode\" aria-hidden=\"true\"></div>\n    <div class=\"version\"><span>Version {5} · {6}{7}</span><button class=\"link\" id=\"tLog\" aria-expanded=\"false\">Was ist neu?</button></div>\n    <div class=\"changelog\" id=\"tChangelog\" hidden>{8}</div>\n  </div></div>": "<div class=\"sunball\" aria-hidden=\"true\"></div><div class=\"skyline\" aria-hidden=\"true\">{0}</div><div class=\"waves\" aria-hidden=\"true\"></div>\n  <div class=\"title-card\"><div class=\"boarding\">\n    <div class=\"bp-head\"><span>Boarding Pass · Economy</span><b>PI 2026-11</b></div>\n    <div class=\"bp-body\">\n      <h1 class=\"title-name\">Fit PI Planning <span>The Game</span></h1>\n      <div class=\"bp-route\"><div><small>From</small><b>ZRH</b></div><span class=\"plane\">✈</span><div><small>To</small><b>VLC</b></div></div>\n      <div class=\"bp-grid\"><div><small>Date</small><b>02.11.2026</b></div><div><small>Gate</small><b>B42</b></div><div><small>Seat</small><b>14A</b></div><div><small>Destination</small><b>Colba, 1st floor</b></div></div>\n      <p class=\"title-sub\">Five days, three teams, one plan. Fly to Valencia with the POs, find your suitcase, the Hotel Kramer and the right doorbell at the Colba tower. Plan the next half year with Indurain, Meeseeks and Rocket – and in between enjoy paella, Mestalla, kart track, sailing trip and e-bike rides.</p>\n      <div class=\"title-btns\">\n        {1}\n        {2}\n        <button class=\"btn {3}\" id=\"tNew\">{4}</button>\n      </div>\n    </div>\n    <div class=\"bp-tear\"></div>\n    <div class=\"keys\">Keyboard: <kbd>WASD</kbd>/<kbd>arrows</kbd> walk · <kbd>Shift</kbd> run · <kbd>E</kbd> action · <kbd>M</kbd> phone · <kbd>P</kbd> photo. On mobile: drag on the left to walk, <kbd>A</kbd> for actions. Runs entirely in the browser, the save game stays on this device.</div>\n    <div class=\"barcode\" aria-hidden=\"true\"></div>\n    <div class=\"version\"><span>Version {5} · {6}{7}</span><button class=\"link\" id=\"tLog\" aria-expanded=\"false\">What's new?</button></div>\n    <div class=\"changelog\" id=\"tChangelog\" hidden>{8}</div>\n  </div></div>", "<button class=\"btn primary\" id=\"tCont\">Weiterspielen · {0}, {1} {2}</button>": "<button class=\"btn primary\" id=\"tCont\">Continue · {0}, {1} {2}</button>", "<p class "><small>Money left</small><b>{13}</b></div></div>\n      <p class=\"note\">Indurain {14} % · Meeseeks {15} % · Rocket {16} %</p>\n      </div><div class=\"panel-foot\"><span>Total score: {17}</span><button class=\"btn primary\" id=\"endNew\">New game</button></div></div>", "Wer spielt mit?": "Who's playing?", "Vorschlag: {0}. Tipp auf einen anderen Namen oder gestalte dein Aussehen – dann Boarding!": "Suggestion: {0}. Tap another name or customise your look – then boarding!", "Reisegruppe": "Travel group", "{0}. Jetzt Aussehen gestalten – oder direkt einsteigen.": "{0}. Customise your look now – or board right away.", "Alle anderen spielen als Kolleginnen und Kollegen mit. Wer einen PO spielt, plant mit dessen Team; alle anderen helfen ihrem Team. Die Reisegruppe landet am Flughafen, die Colba-Leute holen sie dort ab.": "Everyone else joins in as colleagues. If you play a PO, you plan with their team; everyone else helps their own team. The travel group lands at the airport, the Colba people pick them up there.", "Organisator · PO Indurain": "Organiser · PO Indurain", "PO Meeseeks · Autofan": "PO Meeseeks · car fan", "PO Rocket": "PO Rocket", "Geschäftsführer · zum ersten Mal dabei": "Managing director · first time here", "Battery-Pass-Spezialist": "Battery pass specialist", "iOS-Entwickler aus Leipzig": "iOS developer from Leipzig", "Product Manager aus Fuerteventura · Surfer": "Product manager from Fuerteventura · surfer", "Teamleiter Indurain": "Team lead Indurain", "Hardware-Entwickler · CANopen-Experte": "Hardware developer · CANopen expert", "Software-Entwicklerin · Indurain": "Software developer · Indurain", "Backend-Entwicklerin": "Backend developer", "DevOps-Engineer": "DevOps engineer", "Inhaber von Colba · Android": "Owner of Colba · Android", "Android-Entwickler": "Android developer", "UX- und UI-Designerin": "UX and UI designer", "Software-Architekt · Bassist": "Software architect · bassist", "Software-Entwickler · Rocket": "Software developer · Rocket", "Software-Entwickler · Radfahrer": "Software developer · cyclist", "Backoffice · Organisation": "Back office · organisation", "Gepäckband 3: Die Schweizer landen – hol sie dort ab": "Baggage belt 3: the Swiss are landing – pick them up there", "Du bist {0}, {1}. Juanjo hat dich zum Flughafen geschickt: Die Schweizer landen um 12 Uhr, Band 3. Hol sie ab und bring sie ins Hotel Kramer – Juanjo hat für die PI-Woche auch für euch Valencianer Zimmer gebucht, damit nach dem Agua de Valencia niemand Mofa fahren muss.": "You are {0}, {1}. Juanjo sent you to the airport: the Swiss land at noon, belt 3. Pick them up and take them to Hotel Kramer – Juanjo has booked rooms for you Valencians too for the PI week, so nobody has to ride a moped after the Agua de Valencia.", "Kein Koffer für dich – du bist der Abholservice. Die Schweizer stehen irgendwo in der Halle: {0}. Sie winken mit einem „!“ (oder rauchen, oder schauen Autos an).": "No suitcase for you – you're the pick-up service. The Swiss are somewhere in the hall: {0}. They wave with a \"!\" (or smoke, or look at cars).", "Band 3 dreht weiter. Deine Gäste warten in der Halle.": "Belt 3 keeps turning. Your guests are waiting in the hall.", "Tasche auf: Laptop, Ladegerät, ein Pullover. Juanjo hat gesagt: „Pack für eine Woche Hotel. Teambuilding.“ Das Zimmer hat Meerblick – wenn man sich weit aus dem Fenster lehnt.": "Bag open: laptop, charger, a jumper. Juanjo said: \"Pack for a week at the hotel. Team building.\" The room has a sea view – if you lean far enough out of the window.", "Das ist dein Platz.": "That's your spot.", "Samstag, 8:15 – Taxi zum Flughafen …": "Saturday, 8:15 – taxi to the airport …", "Die Schweizer zum Flughafen bringen …": "Taking the Swiss to the airport …", "{0} winkt den Schweizern nach {1} Tagen am Flughafen nach.": "{0} waves the Swiss goodbye at the airport after {1} days.", "{0} fliegt nach {1} Tagen zurück.": "{0} flies back after {1} days.", "iOS-Entwickler": "iOS developer", "Tennis": "Tennis", "Zweimal die Woche Tennis, seit zwanzig Jahren. Vorhand wie ein Rennwagen, Rückhand wie ein Anhänger.": "Tennis twice a week, for twenty years. Forehand like a racing car, backhand like a trailer.", "Der Padel-Court beim Park? Padel ist Tennis für Leute, die keine Lust auf Laufen haben. Ich spiele trotzdem mit. Bring deinen Schläger – ach, Sergio hat welche.": "The padel court by the park? Padel is tennis for people who don't feel like running. I'll play anyway. Bring your racket – oh, Sergio has some.", "Nadal hat auf Sand gewonnen, ich verliere auf Sand. Hartplatz. Immer Hartplatz.": "Nadal won on clay, I lose on clay. Hard court. Always hard court.", "Boxen": "Boxing", "Dienstag und Donnerstag Boxtraining. Sandsack, Seil, Pratzen. Besser als jede Retrospektive.": "Boxing training Tuesdays and Thursdays. Heavy bag, rope, pads. Better than any retrospective.", "Boxen und Rauchen? Ja, ich weiss. Mein Trainer sagt das auch. Jede Woche.": "Boxing and smoking? Yes, I know. My coach says so too. Every week.", "Im Ring zählt nur die nächste Runde. Im Sprint auch. Deshalb bin ich PO geworden.": "In the ring only the next round counts. In a sprint too. That's why I became a PO.", "Fridays for Future": "Fridays for Future", "Freitags bin ich in Leipzig auf der Demo. Darum: Zug statt Flieger, wenn es geht. Nach Valencia ging es nicht – 17 Stunden, sagt der Schalterbeamte.": "On Fridays I'm at the demo in Leipzig. That's why: train instead of plane whenever possible. To Valencia it wasn't possible – 17 hours, says the ticket clerk.", "E-Bikes statt Autos, das ist für mich keine Roadmap, das ist der Grund, warum ich hier arbeite. Sag das Luigi nicht zu laut.": "E-bikes instead of cars – for me that's not a roadmap, it's the reason I work here. Don't say it too loudly to Luigi.", "Der Battery Pass ist Klimapolitik in einer JSON-Datei. Lukas versteht mich.": "The battery pass is climate policy in a JSON file. Lukas gets me.", "Freitag ist Demo-Tag. Hier: Final-Tag. Auch okay.": "Friday is demo day. Here: final day. Also fine.", "Padel heute Abend? Fast wie Tennis.": "Padel tonight? Almost like tennis.", "Boxtraining fällt diese Woche aus. Dafür: Treppe statt Lift.": "No boxing training this week. Instead: stairs instead of the lift.", "UX-Auge": "UX eye", "Elenas UX-Workshop mitgemacht": "Took part in Elena's UX workshop", "Schichtenmodell": "Layer model", "Carlos’ Architektur-Workshop mitgemacht": "Took part in Carlos' architecture workshop", "Mit Chris Meilensteine und Releases auf die Sprints gelegt": "Placed milestones and releases on the sprints with Chris", "Retro": "Retro", "Die PI-Retrospektive mitgemacht": "Took part in the PI retrospective", "Reproduzierbar": "Reproducible", "Mit Daniel über Testen und Dokumentation geredet": "Talked to Daniel about testing and documentation", "Hat für alles eine Liste. Auch für die Listen.": "Has a list for everything. Including the lists.", "Schätzt Story Points in PS.": "Estimates story points in horsepower.", "Die besten Ideen kommen auf dem Balkon.": "The best ideas come on the balcony.", "Erstes PI Planning. 24 Folien. Noch nie geklingelt.": "First PI planning. 24 slides. Never rung a doorbell.", "Kann die Batterieverordnung auswendig. Freiwillig.": "Knows the battery regulation by heart. Voluntarily.", "Club Mate im Rucksack, SwiftUI im Herzen.": "Club Mate in the backpack, SwiftUI in the heart.", "Morgens Wellen, nachmittags Roadmap.": "Waves in the morning, roadmap in the afternoon.", "Grillt besser, als er deployt. Und er deployt gut.": "Grills better than he deploys. And he deploys well.", "Kennt 2000 CANopen-Indexe. Mindestens.": "Knows 2000 CANopen indexes. At least.", "Hat schon eine Idee, bevor du ausgeredet hast.": "Has an idea before you've finished talking.", "Sagt wenig. Ihr Code sagt alles.": "Says little. Her code says it all.", "Pipeline grün, Tortilla weg.": "Pipeline green, tortilla gone.", "Hat Colba gegründet. Und die Klingel nie angeschrieben.": "Founded Colba. Never labelled the doorbell.", "Testet dreimal. Dann noch einmal.": "Tests three times. Then once more.", "Baut, was Elena zeichnet. Meistens.": "Builds what Elena draws. Mostly.", "Drei Apps im Store, zwei davon gut.": "Three apps in the store, two of them good.", "Hat immer recht. Vor allem bei Buttons.": "Is always right. Especially about buttons.", "Refactort alles. Auch Bass-Riffs.": "Refactors everything. Bass riffs included.", "Hat das SAFe-Buch gelesen. Das ganze.": "Read the SAFe book. All of it.", "60 Kilometer vor der Arbeit. Mit dem Velo.": "60 kilometres before work. By bike.", "Organisiert alles. Ausser die Klingel.": "Organises everything. Except the doorbell.", "Daniel": "Daniel", "Tester · Dokumentation": "Tester · documentation", "Findet den Bug. Und dokumentiert ihn. Mit Screenshot.": "Finds the bug. And documents it. With a screenshot.", "UX-Workshop": "UX workshop", "Architektur-Workshop": "Architecture workshop", "Roadmap-Workshop": "Roadmap workshop", "PI-Retrospektive": "PI retrospective", "mit {0} im Aufenthaltsraum": "with {0} in the lounge", "Ein Nachmittag für die App: Ich zeige euch sechs Stellen, an denen Nutzer gescheitert sind. Ihr sagt mir, was wir ändern. Keine Codes, keine Hexzahlen – Menschen.": "An afternoon for the app: I'll show you six places where users failed. You tell me what we change. No codes, no hex numbers – people.", "Vier Schichten, ein Pfeil nach unten. UI oben, Infrastruktur unten, und nichts zeigt nach oben. Wer das verstanden hat, refactort nie wieder um drei Uhr nachts.": "Four layers, one arrow pointing down. UI at the top, infrastructure at the bottom, and nothing points up. Once you get that, you'll never refactor at three in the morning again.", "Die Roadmap ist ein Surfbrett: Richtung klar, Weg flexibel. Sechs Sprints, zehn Punkte – Meilensteine und Releases. Legt sie so, dass nichts vor seiner Voraussetzung kommt. Und die Demo zuletzt.": "The roadmap is a surfboard: direction clear, path flexible. Six sprints, ten items – milestones and releases. Place them so nothing comes before its prerequisite. And the demo last.", "Bevor wir committen: Was lief gut, was lassen wir, was fangen wir an? Keep, Stop, Start. Robin, du darfst auch.": "Before we commit: what went well, what do we drop, what do we begin? Keep, Stop, Start. Robin, you may join in too.", "Wir machen weiter, wenn du wieder da bist.": "We'll continue when you're back.", "Genau so. Ab morgen sind die Buttons 44 Pixel – und niemand sieht mehr 0x60A0.": "Exactly. From tomorrow the buttons are 44 pixels – and nobody sees 0x60A0 any more.", "Nicht schlecht. Aber bitte: Nutzer sind keine Entwickler. Wir üben das.": "Not bad. But please: users aren't developers. We'll practise that.", "Sauber geschichtet. Der Parser wird stolz auf euch sein, wenn er fertig ist.": "Cleanly layered. The parser will be proud of you once it's done.", "Ein paar Pfeile zeigen nach oben. Das rächt sich im dritten Sprint – ich hab es gesehen.": "A few arrows point upwards. That comes back to bite you in sprint three – I've seen it.", "Das ist eine Roadmap: keine Release vor ihrem Meilenstein, die Demo zuletzt. Ich häng sie ins Büro.": "That's a roadmap: no release before its milestone, the demo last. I'm hanging it up in the office.", "{0} Punkte liegen vor ihrer Voraussetzung oder zu dicht. So fahren wir gegen die Wand – nochmal im nächsten PI.": "{0} items sit before their prerequisite or too close together. That's how we hit the wall – again next PI.", "Keep, Stop, Start – und eine Liste, die wir in drei Monaten wieder anschauen. Danke.": "Keep, Stop, Start – and a list we'll look at again in three months. Thank you.", "Ein paar Stops waren eigentlich Keeps. Retros sind Übung – nächstes PI wieder.": "A few Stops were actually Keeps. Retros take practice – again next PI.", "{0}: {1}. Plan +{2} %.": "{0}: {1}. Plan +{2} %.", "{0} Fehler": "{0} mistakes", "{0} von {1} richtig": "{0} of {1} correct", "Jetzt: {0} mit {1} im Aufenthaltsraum (grosser Bildschirm)": "Now: {0} with {1} in the lounge (big screen)", "Workshops im Aufenthaltsraum": "Workshops in the lounge", "Di 16:00 UX (Elena) · Mi 11:00 Architektur (Carlos) · Do 11:00 Roadmap (Chris) · Fr 11:00 PI-Retro (Simon)": "Tue 16:00 UX (Elena) · Wed 11:00 architecture (Carlos) · Thu 11:00 roadmap (Chris) · Fri 11:00 PI retro (Simon)", "Hast du das dokumentiert?": "Did you document that?", "Ich hab einen Bug gefunden. Drei.": "I found a bug. Three.", "Reproduzierbar?": "Reproducible?", "Testen": "Testing", "Ich teste alles. Auch die Kaffeemaschine. Sie hat einen Bug: Sie macht zu wenig Kaffee.": "I test everything. The coffee machine too. It has a bug: it makes too little coffee.", "Ein Feature ohne Testfall ist ein Gerücht.": "A feature without a test case is a rumour.", "Guillem sagt „läuft bei mir“. Ich sage: Screenshot, Schritte, erwartetes Ergebnis.": "Guillem says \"works on my machine\". I say: screenshot, steps, expected result.", "Alles steht im Wiki. Auch die Klingel. Seite 1, fett.": "Everything is in the wiki. The doorbell too. Page 1, bold.", "Mein Testprotokoll vom Dienstag hat 40 Seiten. Lukas’ Batteriepass hat auch 40. Zufall.": "My test log from Tuesday has 40 pages. Lukas' battery pass has 40 too. Coincidence.", "Wenn es nicht dokumentiert ist, ist es nicht passiert.": "If it isn't documented, it didn't happen.", "Gleich: {0} mit {1} im Aufenthaltsraum.": "Soon: {0} with {1} in the lounge.", "Der Akku-Ring ist rot, obwohl 60 % Akku da sind.": "The battery ring is red although 60 % battery is left.", "Farbe nach Ladezustand: grün über 40 %, orange über 20 %, darunter rot": "Colour by charge: green above 40 %, orange above 20 %, red below", "Ring einfach blau machen": "Just make the ring blue", "Die Prozentzahl weglassen": "Drop the percentage", "Farbe muss etwas bedeuten – sonst lügt sie.": "Colour has to mean something – otherwise it lies.", "Der Start-Button ist 20 Pixel gross.": "The start button is 20 pixels big.", "Mindestens 44  "En Fuerte no había viento, así que no me he perdido nada. Mañana a las seis y media en la playa – ¿quién se apunta?", "Ich hab die Kartbahn gesehen. Mittwochabend. Keine Diskussion.": "He visto el karting. Miércoles por la noche. Sin discusión.", "Ich geh kurz raus, eine rauchen. Bestellt mir einen Krug.": "Salgo un momento a fumar. Pedidme una jarra.", "Also … ich halte morgen den Business Context. 20 Minuten. Ist das hier immer so laut?": "Bueno … mañana presento yo el Business Context. 20 minutos. ¿Aquí siempre hay tanto ruido?", "Erster Krug Agua de Valencia: Cava, Orangensaft, Wodka, Gin. Die Woche kann beginnen. Tipp: nicht zu spät ins Bett – morgen Kickoff.": "Primera jarra de Agua de Valencia: cava, zumo de naranja, vodka, ginebra. Que empiece la semana. Consejo: no te acuestes tarde – mañana kickoff.", "Der Stammtisch der POs. Gerade leer – Pepita hat ein „Reservado“-Schild hingestellt.": "La mesa habitual de los PO. Ahora mismo vacía – Pepita ha puesto un cartel de «Reservado».", "Am Tisch: {0}.": "En la mesa: {0}.", "Hinsetzen und mittrinken": "Sentarse y beber con ellos", "Über das Planning reden": "Hablar del planning", "Weitergehen": "Seguir", "Salud! Auf Valencia.": "¡Salud! Por Valencia.", "Noch eine Caña? Die sind klein hier.": "¿Otra caña? Aquí son pequeñas.", "Wusstet ihr, dass Agua de Valencia 1959 im Café Madrid erfunden wurde?": "¿Sabíais que el Agua de Valencia se inventó en 1959 en el Café Madrid?", "Morgen früh wieder fit, versprochen.": "Mañana por la mañana otra vez en forma, prometido.", "Der Plan von {0} steht bei {1} %. {2}": "El plan de {0} está al {1} %. {2}", "Da geht noch was.": "Aún hay margen.", "Läuft.": "Va bien.", "Die Abhängigkeiten mit Rocket machen mir Sorgen. Carlos will erst refactoren.": "Las dependencias con Rocket me preocupan. Carlos quiere refactorizar primero.", "Fran hat heute 40 CANopen-Indexe aus dem Kopf aufgesagt. Vierzig.": "Fran ha recitado hoy 40 índices CANopen de memoria. Cuarenta.", "Robin fragt alle zeh  mesa de Isabel: agenda, hojas de pedido, un plato de almendras. Ha salido – a organizar la comida.", "Eine Handvoll Mandeln genommen.": "Has cogido un puñado de almendras.", "Dienstag 9:30": "Martes 9:30", "Kickoff": "Kickoff", "Business Context mit Robin": "Business Context con Robin", "Guten Morgen zusammen – buenos días. Ich bin Robin, zum ersten Mal dabei, und ich habe 24 Folien. Keine Sorge, ich überspringe die Hälfte. Das nächste halbe Jahr: E-Bike-Apps, die mit dem Bike über CANopen reden. Batteriepass. OTA-Updates. Und ein Händlerportal.": "Buenos días a todos. Soy Robin, es mi primera vez, y tengo 24 diapositivas. Tranquilos, me salto la mitad. El próximo medio año: apps de bici eléctrica que hablan con la bici por CANopen. Pasaporte de baterías. Actualizaciones OTA. Y un portal de distribuidores.", "Drei Teams, drei Räume. Indurain: Hardware-Nähe und Diagnose. Meeseeks: Android und iOS. Rocket: Web, Architektur, Batteriepass. Mittags gibt es Paella. Fragen?": "Tres equipos, tres salas. Indurain: cerca del hardware y diagnóstico. Meeseeks: Android e iOS. Rocket: web, arquitectura, pasaporte de baterías. Para comer hay paella. ¿Preguntas?", "Eine: Welcher Index für den Battery State of Charge? – Ich weiss es. 0x6060. Nur so.": "Una: ¿qué índice para el estado de carga de la batería? – Lo sé. 0x6060. Por decir algo.", "Und bitte: die Klingel. Ich schreibe sie trotzdem nicht an. Tradition.": "Y por favor: el timbre. Sigo sin rotularlo. Tradición.", "Agenda steht am Whiteboard. Bis Freitag 15 Uhr braucht jedes Team einen Plan mit mindestens 80 % Commitment – Features geschätzt, Risiken geroamt, Abhängigkeiten geklärt. {0}": "La agenda está en la pizarra. Hasta el viernes a las 15 h cada equipo necesita un plan con al menos un 80 % de commitment – features estimadas, riesgos ROAMeados, dependencias resueltas. {0}", "Du bist PO – dein Team schaut auf dich.": "Eres el PO – tu equipo te mira a ti.", "Hilf deinem Team, wo du kannst.": "Ayuda a tu equipo donde puedas.", "Dein Raum: {0}. Dort: Planning Poker am Tisch, CANopen-Quiz mit Fran (Indurain), ROAM am Flipchart, Programm-Board am Whiteboard, Dependency-Board am Bildschirm. Jede Aktivität bringt den Plan weiter – pro Tag einmal.": "Tu sala: {0}. Allí: planning poker en la mesa, quiz CANopen con Fran (Indurain), ROAM en el rotafolio, program board en la pizarra, dependency board en la pantalla. Cada actividad avanza el plan – una vez al día.", "Der Bildschirm zeigt Robins Titelfolie: „Business Context – Colba 2026“. Er beginnt um 9:30.": "La pantalla muestra la diapositiva de portada de Robin: «Business Context – Colba 2026». Empieza a las 9:30.", "Der Bildschirm zeigt „PI PLANNING“. Der Kickoff ist am Dienstag um 9:30.": "La pantalla muestra «PI PLANNING». El kickoff es el martes a las 9:30.", "Der grosse Bildschirm: Plan-Stand aller Teams. Indurain {0} %, Meeseeks {1} %, Rocket {2} %. {3}": "La pantalla grande: estado del plan de todos los equipos. Indurain {0} %, Meeseeks {1} %, Rocket {2} %. {3}", "Final um 15:00.": "Final a las 15:00.", "Final am Freitag um 15:00.": "Final el viernes a las 15:00.", "Die {0} ist aufgegessen. Isabel packt die Reste ein.": "La {0} se ha acabado. Isabel guarda las sobras.", "{0} Hunger?": "{0} ¿Hambre?", "Zugreifen!": "¡A comer!", "Später": "Más tarde", "¡Qué aproveche!": "¡Qué aproveche!", "Der Socarrat ist das Beste. Der knusprige Reis am Boden.": "El socarrat es lo mejor. El arroz crujiente del fondo.", "Nach dem Essen: Siesta? – Nein, Planning.": "Después de comer: ¿siesta? – No, planning.", "Isabel, du bist die Beste.": "Isabel, eres la mejor.", "Healthy Breakfast am Freitag von 8:30 bis 10:30.": "Healthy breakfast el viernes de 8:30 a 10:30.", "Der grosse Tisch. Mittagessen von 13:00 bis 14:30: {0}.": "La mesa grande. Comida de 13:00 a 14:30: {0}.", "Der grosse Tisch im Aufenthaltsraum. Hier gibt es Mittagessen, Präsentationen und Diskussionen über den Socarrat.": "La mesa grande de la sala común. Aquí hay comidas, presentaciones y discusiones sobre el socarrat.", "Sechs Kaffees heute. Vicente schaut besorgt.": "Seis cafés hoy. Vicente te mira preocupado.", "Nespresso. George Clooney wäre stolz.": "Nespresso. George Clooney estaría orgulloso.", "Kapsel rein, Knopf drücken, warten. Das Beste am Office.": "Cápsula dentro, botón, esperar. Lo mejor de la oficina.", "Fran hat die Maschine auf CANopen umgebaut. Sagt er. Sie macht trotzdem nur Kaffee.": "Fran ha convertido la máquina a CANopen. Eso dice. Sigue haciendo solo café.", "Der Kühlschrank: Wasser, Cola, ein Tupperware mit dem Namen „VICENTE – NICHT ANFASSEN“.": "La nevera: agua, cola, un táper con el nombre «VICENTE – NO TOCAR».", "Wasser nehmen": "Coger agua", "Cola nehmen": "Coger una cola", "Vicentes Tupperware": "El táper de Vicente", "Zu": "Cerrar", "… das war meine Tortilla. Ich sag nichts. Aber ich merk es mir.": "… esa era mi tortilla. No digo nada. Pero me acuerdo.", "Ein Becher Wasser. Gut gegen Mascletà-Staub und gestern Abend.": "Un vaso de agua. Va bien contra el polvo de la mascletà y contra lo de anoche.", "Zwanzig Minuten Sofa. Elena nennt es „Designpause“.": "Veinte minutos de sofá. Elena lo llama «pausa de diseño».", "Hier entstehen die besten Ideen. Zum Beispiel: Rocket übernimmt das OTA-Update. Carlos weiss es noch nicht.": "Aquí nacen las mejores ideas. Por ejemplo: Rocket se encarga de la actualización OTA. Carlos aún no lo sabe.", "Blick auf den Turia-Park. Und auf 14 Kräne. Valencia baut.": "Vistas al Jardín del Turia. Y a 14 grúas. Valencia construye.", "Ich hab Salva das Rauchen abgewöhnt. Er vapt jetzt. Fortschritt.": "He conseguido que Salva deje de fumar. Ahora vapea. Progreso.", "Balkon, Blick auf den Turia-Park. Eine Zigarette später ist die Welt ruhiger.": "Balcón, vistas al Jardín del Turia. Un cigarrillo después, el mundo está más tranquilo.", "Der Balkon. Dominiques Revier – Aschenbecher, Blick auf den Park. Ohne Zigaretten: frische Luft.": "El balcón. Territorio de Dominique – cenicero, vistas al parque. Sin cigarrillos: aire fresco.", "Office-WC. Jemand hat ein Post-it an den Spiegel geklebt: „Definition of Done?“": "Baño de la oficina. Alguien ha pegado un pósit en el espejo: «¿Definition of Done?»", "Der CANopen-Prüfstand: ein Bike-Controller am Kabel, ein Oszilloskop, ein Laptop mit Frans Index-Tabelle.": "El banco de pruebas CANopen: un controlador de bici al cable, un osciloscopio, un portátil con la tabla de índices de Fran.", "Fran ist nicht da. Ohne ihn fasst man den Prüfstand besser nicht an – letztes Mal hat Guillem den Motor rückwärts laufen lassen.": "Fran no está. Sin él mejor no tocar el banco de pruebas – la última vez Guillem hizo girar el motor al revés.", "Bike 1 (rot, Werkstatt-Firmware 2.4)": "Bici 1 (roja, firmware de taller 2.4)", "Bike 2 (blau, OTA-Kandidat)": "Bici 2 (azul, candidata OTA)", "Diagnose-PC, per CAN-Kabel am {0} angeschlossen. Auf dem Bildschirm laufen die CANopen-Objekte durch.": "PC de diagnóstico, conectado por cable CAN a la {0}. Por la pantalla desfilan los objetos CANopen.", "Telemetrie lesen": "Leer telemetría", "Firmware flashen (OTA)": "Flashear firmware (OTA)", "Fehlerspeicher löschen": "Borrar memoria de errores", "Lassen": "Dejarlo", "0x6060 SOC {0} % · 0x6061 Spannung {1} V · 0x6064 Motortemperatur {2} °C · 0x1001 Error-Register 0x00. Alles grün.": "0x6060 SOC {0} % · 0x6061 tensión {1} V · 0x6064 temperatura del motor {2} °C · 0x1001 registro de errores 0x00. Todo en verde.", "Index 0x6060, Subindex 0. Merk dir das – kommt im Quiz.": "Índice 0x6060, subíndice 0. Recuérdalo – sale en el quiz.", "Der Ladezustand kommt alle 100 Millisekunden per PDO. Wer das pollt, hat CANopen nicht verstanden.": "El estado de carga llega cada 100 milisegundos por PDO. Quien hace polling de eso no ha entendido CANopen.", "Blocktransfer … 41 % … Verbindung weg. Das Bike blinkt rot. Bootloader-Modus. Fran wird das morgen reparieren – mit einem Blick, den du nicht vergessen wirst.": "Transferencia en bloque … 41 % … conexión perdida. La bici parpadea en rojo. Modo bootloader. Fran lo arreglará mañana – con una mirada que no olvidarás.", "SDO-Blocktransfer, 180 Sekunden, Neustart. Firmware 2.5 läuft. Glück gehabt – Fran hätte dich das nie allein machen lassen.": "Transferencia en bloque SDO, 180 segundos, reinicio. Firmware 2.5 en marcha. Has tenido suerte – Fran nunca te habría dejado hacerlo solo.", "OTA über CANopen: SDO-Blocktransfer, 1 Kilobyte pro Block, Checksumme am Ende. Schau zu.": "OTA por CANopen: transferencia en bloque SDO, 1 kilobyte por bloque, checksum al final. Mira.", "Drei Minuten Fortschrittsbalken. Fran redet derweil über Index-Tabellen. Neustart – Firmware 2.5 läuft. Das ist der Prototyp für die OTA-Story von Rocket.": "Tres minutos de barra de progreso. Mientras tanto Fran habla de tablas de índices. Reinicio – firmware 2.5 en marcha. Es el prototipo para la historia OTA de Rocket.", "Fehlerspeicher: 3 Einträge (Unterspannung, CAN-Timeout, Drehmomentsensor). Gelöscht.": "Memoria de errores: 3 entradas (subtensión, timeout CAN, sensor de par). Borrada.", "Gelöscht?! Die wollte ich zuerst lesen. Der CAN-Timeout war mein Beweis gegen den Lieferanten.": "¿¡Borrada!? Quería leerla primero. El timeout CAN era mi prueba contra el proveedor.", "Fran wäre nicht begeistert – er liest Fehlerspeicher wie andere Leute Zeitungen.": "A Fran no le haría gracia – lee memorias de errores como otros leen el periódico.", "Die Test-E-Bikes von Colba. Akku voll, Display an.": "Las bicis eléctricas de prueba de Colba. Batería llena, pantalla encendida.", "E-Bike ausleihen (Stadt)": "Coger una bici eléctrica (ciudad)", "Du ziehst das CAN-Kabel ab und schiebst ein Test-Bike durch die Lounge zum Lift. Unten geht die Fahrt los – im Office ist Fahren verboten (Isabel).": "Desconectas el cable CAN y empujas una bici de prueba por el lounge hasta el ascensor. Abajo empieza el paseo – en la oficina está prohibido circular (Isabel).", "Du sitzt schon auf einem E-Bike.": "Ya vas en una bici eléctrica.", "Colba-E-Bikes. Ohne Badge läuft hier nichts – erst oben vorstellen.": "Bicis eléctricas Colba. Sin tarjeta aquí no hay nada que hacer – preséntate arriba primero.", "Bici Rent": "Bici Rent", "Die Colba-Test-Bikes. Fran hat sie frisch geladen.": "Las bicis de prueba de Colba. Fran las acaba de cargar.", "E-Bike-Miete: {0} € für den Tag, Akku voll, Helm inklusive.": "Alquiler de bici eléctrica: {0} € por el día, batería llena, casco incluido.", "E-Bike nehmen": "Coger una bici eléctrica", "Nein danke": "No, gracias", "Ohne Geld kein Bike.": "Sin dinero no hay bici.", "Aufgesessen! Mit dem E-Bike bist du doppelt so schnell – bis der Akku leer ist. Radweg im Turia-Park, Promenade am Strand. Mit A absteigen.": "¡En marcha! Con la bici eléctrica vas el doble de rápido – hasta que se agote la batería. Carril bici en el Jardín del Turia, paseo en la playa. Bájate con A.", "Abgestiegen. Akku: {0} %. Das Bike steht jetzt hier – gut, dass Colba genug davon hat.": "Te has bajado. Batería: {0} %. La bici se queda aquí – menos mal que Colba tiene de sobra.", "Erst der Kickoff um 9:30 im Aufenthaltsraum.": "Primero el kickoff a las 9:30 en la sala común.", "{0}. Niemand da.": "{0}. No hay nadie.", "{0}: {1} am Tisch.": "{0}: {1} en la mesa.", "Abhängigkeit verhandeln": "Negociar una dependencia", "Kurz plaudern": "Charlar un momento", "Weiter": "Seguir", "Planning Poker: Features schätzen": "Planning poker: estimar features", "CANopen-Index-Quiz mit Fran": "Quiz de índices CANopen con Fran", "Fran kommt vorbei · +8 %": "Fran se pasa · +8 %", "Mit dem Team reden": "Hablar con el equipo", "{0}. {1} Plan: {2} %.": "{0}. {1} Plan: {2} %.", " sitzen am Tisch.": " están sentados a la mesa.", "Das Team ist gerade nicht da – die Laptops laufen trotzdem.": "El equipo no está ahora mismo – los portátiles siguen encendidos.", "Niemand da zum Reden. Mittagspause? Balkon?": "No hay nadie con quien hablar. ¿Pausa para comer? ¿Balcón?", "Planning Poker für heute erledigt. Morgen gibt es neue Features.": "Planning poker terminado por hoy. Mañana hay features nuevas.", "{0} von {1} Features im Konsens geschätzt. Plan +{2} %. {3}": "{0} de {1} features estimadas por consenso. Plan +{2} %. {3}", "Das Team nickt zufrieden.": "El equipo asiente satisfecho.", "Die Ausreisser diskutiert ihr morgen weiter.": "Los casos raros los seguiréis discutiendo mañana.", "Erst der Kickoff.": "Primero el kickoff.", "Heute schon gefragt. Morgen neue Indexe – ich kenne noch 2000 mehr.": "Hoy ya has preguntado. Mañana índices nuevos – me sé 2000 más.", "Objektverzeichnis, Objektverzeichnis. Jedes Bike-Signal hat einen Index. Ich frag, du antwortest. Bereit?": "Diccionario de objetos, diccionario de objetos. Cada señal de la bici tiene un índice. Yo pregunto, tú respondes. ¿Listo?", "Alle richtig. Hier, mein Spickzettel. Verlier ihn nicht – er ist handgeschrieben.": "Todo correcto. Toma, mi chuleta. No la pierdas – está escrita a mano.", "{0} von {1}. {2} Plan +{3} %.": "{0} de {1}. {2} Plan +{3} %.", "¡Perfecto!": "¡Perfecto!", "Nicht schlecht für einen PO.": "No está mal para un PO.", "Du brauchst mehr Zeit am Prüfstand.": "Necesitas más tiempo en el banco de pruebas.", "Das Risiko-Flipchart von {0}. {1}": "El rotafolio de riesgos de {0}. {1}", "„Risiko: Carlos refactort alles.“ – Owned.": "«Riesgo: Carlos lo refactoriza todo.» – Owned.", "„Risiko: Akku-Lieferant.“ – Mitigated.": "«Riesgo: proveedor de baterías.» – Mitigated.", "„Risiko: Fallas-Woche.“ – Accepted.": "«Riesgo: semana de Fallas.» – Accepted.", "Die Risiken sind heute geroamt. Morgen tauchen neue auf – das ist ihre Natur.": "Los riesgos ya están ROAMeados hoy. Mañana aparecerán otros – es su naturaleza.", "ROAM: {0} von {1} Risiken sinnvoll eingeordnet (Resolved, Owned, Accepted, Mitigated). Plan +{2} %.": "ROAM: {0} de {1} riesgos bien clasificados (Resolved, Owned, Accepted, Mitigated). Plan +{2} %.", "Das Programm-Board von {0}: {1} % geplant. Post-its in Teamfarbe, rote Fäden zu den anderen Teams.": "El program board de {0}: {1} % planificado. Pósits del color del equipo, hilos rojos a los otros equipos.", "Erst der Kickoff um 9:30.": "Primero el kickoff a las 9:30.", "Das Board ist für heute gefüllt. Post-its halten – meistens.": "El board ya está lleno por hoy. Los pósits aguantan – casi siempre.", "{0} Plan +{1} %.": "{0} Plan +{1} %.", "Alle sechs Sprints gefüllt, keiner überlastet.": "Los seis sprints llenos, ninguno sobrecargado.", "{0} Sprints sauber, der Rest überlastet oder leer.": "{0} sprints limpios, el resto sobrecargados o vacíos.", "Dependency-Board {0}: ": "Dependency board {0}: ", "geklärt ✓": "resuelta ✓", "offen – mit ": "abierta – negociar con ", " verhandeln": "", "Keine offenen Abhängigkeiten mit {0}.": "No hay dependencias abiertas con {0}.", "{0} ist nicht da ({1}). Ohne Lead keine Verhandlung.": "{0} no está ({1}). Sin lead no hay negociación.", "{0}? {1} Wann brauchst du es – beziehungsweise wann liefert ihr?": "¿{0}? {1} ¿Cuándo lo necesitas – o mejor dicho, cuándo lo entregáis?", "Deal. Ich schreib es auf das Board – roter Faden.": "Trato hecho. Lo apunto en el board – hilo rojo.", "Passt in unseren Sprint. Abgemacht.": "Cabe en nuestro sprint. Acordado.", "Okay, aber wenn Carlos refactort, verschiebt sich alles um einen Sprint. Nur dass du es weisst.": "Vale, pero si Carlos refactoriza, todo se mueve un sprint. Para que lo sepas.", "So geht das nicht – der Sprint ist zu früh oder zu spät. Schau dir unsere Kapazität an und komm nochmal.": "Así no – el sprint es demasiado pronto o demasiado tarde. Mira nuestra capacidad y vuelve.", "Ausfahrt! {0} fährt durch den Turia-Park bis zum Strand. Akku-Management ist Teil des Tests: Wer mit leerem Akku ankommt, trägt das Bike die Treppe hoch.": "¡Salida! {0} recorre el Jardín del Turia hasta la playa. La gestión de la batería es parte de la prueba: quien llegue con la batería vacía sube la bici por la escalera.", "Zurück ins Office …": "De vuelta a la oficina …", "{0} Und: Nach dem Fahren plant es sich leichter. Das ist wissenschaftlich bewiesen. Von mir.": "{0} Y además: después de pedalear se planifica mejor. Está demostrado científicamente. Por mí.", "Akku {0} % – sauber gefahren!": "Batería {0} % – ¡bien conducido!", "Akku leer. Das Bike trägst du jetzt hoch.": "Batería agotada. Ahora subes la bici a pulso.", "Die Final-Präsentation ist am Freitag um 15:00.": "La presentación final es el viernes a las 15:00.", "Freitag 15:00": "Viernes 15:00", "Final & Confidence Vote": "Final y Confidence Vote", "Drei Teams, drei Pläne. {0}. Jetzt stellt jedes Team seine Ziele vor – und dann stimmen wir ab, wie sicher wir uns sind: fünf Finger für „läuft“, ein Finger für „vergiss es“.": "Tres equipos, tres planes. {0}. Ahora cada equipo presenta sus objetivos – y después votamos lo seguros que estamos: cinco dedos para «va a salir», un dedo para «olvídalo».", "Features geschätzt, Risiken geroamt, Abhängigkeiten sauber. Wir committen.": "Features estimadas, riesgos ROAMeados, dependencias limpias. Nos comprometemos.", "Der Plan steht zur Hälfte. Wir committen auf die ersten drei Sprints, der Rest ist Forecast.": "El plan está a medias. Nos comprometemos con los tres primeros sprints, el resto es previsión.", "Ehrlich gesagt: Wir haben zu wenig geplant. Viel Poker, wenig Board.": "Sinceramente: hemos planificado poco. Mucho póker, poco board.", "Durchschnitt über vier! Ich habe keine Ahnung, ob das normal ist, aber Simon sagt, das ist sehr gut. Bar Pepita, ich zahle.": "¡Media por encima de cuatro! No tengo ni idea de si eso es normal, pero Simon dice que es muy bueno. Bar Pepita, invito yo.", "Drei Komma irgendwas. Solide. Ich habe gelernt, was ein Sprint ist, und ihr habt einen Plan. Prost.": "Tres coma algo. Sólido. He aprendido qué es un sprint y vosotros tenéis un plan. Salud.", "Hm. Unter drei. Wir reden am Montag nochmal. Trotzdem: danke, Valencia.": "Hm. Por debajo de tres. El lunes volvemos a hablar. Aun así: gracias, Valencia.", "Und jetzt alle raus: Das Office schliesst, der Samstag ist frei. Heimflug um 10:00 – das Taxi steht um 8:15 vor dem Hotel.": "Y ahora todos fuera: la oficina cierra, el sábado es libre. Vuelo de vuelta a las 10:00 – el taxi está a las 8:15 delante del hotel.", "Garten, Grill, Pool, Bass": "Jardín, parrilla, piscina, bajo", "¡Bienvenidos a mi casa! Das ist der Garten, das ist der Pool, das ist der Grill. Alles andere ist unwichtig. Chorizo ist fast fertig, Pollo braucht noch zwanzig Minuten. Bea hat Ropa Vieja mitgebracht.": "¡Bienvenidos a mi casa! Este es el jardín, esta es la piscina, esta es la parrilla. Lo demás no importa. El chorizo está casi listo, el pollo necesita veinte minutos más. Bea ha traído ropa vieja.", "Zwei Stunden geschmort. Wer es nicht probiert, bekommt morgen keine Code-Reviews.": "Dos horas a fuego lento. Quien no lo pruebe, mañana no tiene code reviews.", "Und nach dem Essen: ein Solo. Danny hat die Nachbarn gewarnt. Die Nachbarn haben Ohrstöpsel gekauft.": "Y después de cenar: un solo. Danny ha avisado a los vecinos. Los vecinos se han comprado tapones.", "Im Garten: Grill (A drücken zum Grillen), Gartentisch mit Mojitos und Ropa Vieja, Carlos’ Verstärker, Pool und Hängematte. Das Gartentor unten bringt dich per Taxi zurück in die Stadt.": "En el jardín: parrilla (pulsa A para asar), mesa con mojitos y ropa vieja, el amplificador de Carlos, piscina y hamaca. La verja de abajo te lleva en taxi de vuelta a la ciudad.", "Drinnen ist nur die Küche – und Beas Topf. Der Garten ist die Party.": "Dentro solo está la cocina – y la olla de Bea. La fiesta es el jardín.", "Das Haus habe ich 2019 gekauft. Mit Garten, weil ich in Havanna auf einem Balkon im dritten Stock gegrillt habe. Die Nachbarn fanden das weniger lustig als ich.": "La casa la compré en 2019. Con jardín, porque en La Habana hacía barbacoa en un balcón de un tercer piso. A los vecinos les hacía menos gracia que a mí.", "Grillzange? Chorizo, Pollo oder Maiskolben – aber nicht verbrennen lassen. Der Grill ist heiss wie Havanna im August.": "¿Pinzas? Chorizo, pollo o mazorca – pero que no se queme. La parrilla está tan caliente como La Habana en agosto.", "Der Grill ist aus. Danny grillt nur, wenn Gäste da sind.": "La parrilla está apagada. Danny solo asa cuando hay invitados.", "Chorizo wenden & essen": "Dar la vuelta al chorizo y comer", "Pollo asado": "Pollo asado", "Nur zuschauen": "Solo mirar", "Okay": "Vale", "¡Ay, no! Verbrannt. Das war mein letzter Chorizo. Nein, Spass – hier, der nächste.": "¡Ay, no! Quemado. Era mi último chorizo. No, es broma – toma, el siguiente.", "{0}. Rauch, Holzkohle, ein Hauch Limette – Danny marinert mit Mojo.": "{0}. Humo, carbón, un toque de lima – Danny marina con mojo.", "Vom Grill direkt auf den Teller. Vicente fotografiert sein Essen, Estella isst seines.": "De la parrilla directo al plato. Vicente fotografía su comida, Estella se come la suya.", "Danny wendet mit der einen Hand und erklärt mit der anderen den Backlog.": "Danny da la vuelta con una mano y explica el backlog con la otra.", "Der Gartentisch: Gläser, Limetten, Hierbabuena. Vorbereitet für den Abend.": "La mesa del jardín: vasos, limas, hierbabuena. Preparada para la noche.", "Setz dich. Ropa Vieja, Mojito nach Dannys Rezept – oder beides?": "Siéntate. Ropa vieja, mojito con la receta de Danny – ¿o las dos cosas?", "Ropa Vieja": "Ropa vieja", "Mojito cubano": "Mojito cubano", "Beides": "Las dos cosas", "Ropa Vieja heisst „alte Kleider“ – wegen der Fasern. Schmeckt besser, als es heisst.": "Ropa vieja se llama así por las hebras. Sabe mejor de lo que suena.", "Hierbabuena, nicht Minze! Das ist der Unterschied zwischen Havanna und einer Hotelbar.": "¡Hierbabuena, no menta! Esa es la diferencia entre La Habana y un bar de hotel.", "Havana Club 3 Años. In der Schweiz zahlt ihr dafür 40 Franken. Hier: 12 Euro. Sag es Robin nicht.": "Havana Club 3 Años. En Suiza pagáis 40 francos por esto. Aquí: 12 euros. No se lo digas a Robin.", "Ein kleiner Verstärker im Garten. Carlos ist noch nicht da – ir den Battery-Pass-Flyer (Tasche).": "Lukas te da el folleto del pasaporte de baterías (bolsa).", "Alle beisammen! Der Ausgang ist unten – dort stehen die Taxis.": "¡Todos juntos! La salida está abajo – ahí están los taxis.", "Hola!": "¡Hola!", "Wie steht der Plan?": "¿Cómo va el plan?", "Da fehlt noch viel – Poker, Board, Risiken.": "Aún falta mucho – póker, board, riesgos.", "Auf gutem Weg. Die Abhängigkeiten nicht vergessen.": "Por buen camino. No olvides las dependencias.", "Commitment-reif. Freitag wird gut.": "Listo para el commitment. El viernes irá bien.", "Alles im Plan?": "¿Todo según el plan?", "Hast du die Agenda gesehen?": "¿Has visto la agenda?", "Reservierung für Donnerstag steht.": "La reserva del jueves está hecha.", "Was steht heute an?": "¿Qué toca hoy?", "Organisation": "Organización", "Taxi Samstag 8:15, Flug 10:00. Ich hab es dreimal bestätigt.": "Taxi el sábado a las 8:15, vuelo a las 10:00. Lo he confirmado tres veces.", "Isabel und ich haben den Mittagsplan: Di Paella, Mi Burger, Do Bocadillos, Fr Healthy.": "Isabel y yo tenemos el plan de comidas: Ma paella, Mi burger, Ju bocadillos, Vi healthy.", "Jeder hat seinen Raum. Jeder hat Post-its. Was kann schiefgehen.": "Cada uno tiene su sala. Cada uno tiene pósits. Qué puede salir mal.", "Hast du die Autos hier gesehen?": "¿Has visto los coches de aquí?", "Mittwoch: Kartbahn.": "Miércoles: karting.", "Ein Seat León mit 300 PS …": "Un Seat León con 300 CV …", "Über Autos reden": "Hablar de coches", "Der Taxifahrer hatte einen Toledo. Ein Toledo! Die gibt es seit 2019 nicht mehr.": "El taxista tenía un Toledo. ¡Un Toledo! Ya no se fabrican desde 2019.", "Cupra, das ist Seat mit Attitüde. Und Kupferfarbe.": "Cupra es Seat con actitud. Y color cobre.", "Wenn ich reich bin: Alpine A110. Leicht, französisch, laut.": "Cuando sea rico: Alpine A110. Ligero, francés, ruidoso.", "E-Bikes sind auch Autos. Nur ohne Dach. Und ohne Motor. Also, mit kleinem Motor.": "Las bicis eléctricas también son coches. Solo que sin techo. Y sin motor. Bueno, con motor pequeño.", "Kartbahn?": "¿Karting?", "Heute Abend ab 18 Uhr bin ich dort. Südwesten der Stadt. Bring Mut mit.": "Esta noche desde las 18 h estoy allí. Al suroeste de la ciudad. Trae valor.", "Mittwochabend. Ich bin dort. Du wirst verlieren.": "Miércoles por la noche. Allí estaré. Vas a perder.", "Kommst du mit auf den Balkon?": "¿Vienes al balcón?", "Hast du Feuer?": "¿Tienes fuego?", "Rocket ist bereit.": "Rocket está listo.", "Rauchpause?": "¿Pausa para fumar?", "Balkon, oben rechts im Aufenthaltsraum. Ich geh vor.": "Balcón, arriba a la derecha en la sala común. Voy delante.", "Hier? Gern. Aber nur, wenn du eine hast.": "¿Aquí? Con gusto. Pero solo si tienes uno.", "Carlos refactort, Salva lernt, Aitor löst. Und Lukas erklärt den Batteriepass. Beste Mischung.": "Carlos refactoriza, Salva aprende, Aitor resuelve. Y Lukas explica el pasaporte de baterías. La mejor mezcla.", "Rocket macht das Händlerportal und die Battery-Pass-API. Und OTA, wenn Indurain liefert.": "Rocket hace el portal de distribuidores y la API del pasaporte de baterías. Y OTA, si Indurain entrega.", "Sag mal, wo ist nochmal der Aufenthaltsraum?": "Oye, ¿dónde estaba la sala común?", "Ist das normal, dass alle Post-its kleben?": "¿Es normal que todos los pósits se peguen?", "Mein erstes PI Planning. Aufregend.": "Mi primer PI Planning. Emocionante.", "Den Weg zeigen": "Enseñar el camino", "Danke. Ich hatte den Lift rechts genommen – der hält im Zwischengeschoss.": "Gracias. Había cogido el ascensor derecho – para en el entresuelo.", "Ah, der Aufenthaltsraum ist rechts. Ich war im WC. Zweimal.": "Ah, la sala común está a la derecha. Yo estaba en el baño. Dos veces.", "Ihr seid alle so geduldig mit mir.": "Sois todos tan pacientes conmigo.", "Meine Folien kamen an, oder? Fran hat gelacht. Ich glaube, es war ein gutes Lachen.": "Mis diapositivas han gustado, ¿no? Fran se ha reído. Creo que era una risa buena.", "24 Folien. Ich übe noch. Was heisst nochmal „Commitment“ auf Spanisch?": "24 diapositivas. Sigo practicando. ¿Cómo se decía «commitment» en español?", "Wusstest du, dass jede Batterie ab 2027 einen Pass braucht?": "¿Sabías que a partir de 2027 cada batería necesita un pasaporte?", "Der Entwurf hat 40 Seiten.": "El borrador tiene 40 páginas.", "Grüezi.": "Grüezi.", "Battery Pass erklären lassen": "Que te expliquen el pasaporte de baterías", "EU-Batterieverordnung: Jede E-Bike-Batterie bekommt einen digitalen Pass. QR-Code drauf, Daten dahinter: Herkunft, Kapazität, CO₂-Fussabdruck, Zustand. Rocket baut die API, Meeseeks zeigt es in der App. Und die Zelle meldet ihren State of Health über CANopen – Index 0x6080, falls Fran fragt.": "Reglamento europeo de baterías: cada batería de bici eléctrica recibe un pasaporte digital. Código QR encima, datos detrás: origen, capacidad, huella de CO₂, estado. Rocket construye la API, Meeseeks lo muestra en la app. Y la celda informa de su estado de salud por CANopen – índice 0x6080, por si Fran pregunta.", "Schweiz vs. Spanien": "Suiza contra España", "Hier isst man um 14 Uhr Mittag. Mein Magen ist auf Berner Zeit.": "Aquí se come a las 14 h. Mi estómago va en hora de Berna.", "Die Mascletà ist lauter als das Zibelemärit-Feuerwerk. Viel lauter.": "La mascletà es más ruidosa que los fuegos del Zibelemärit. Mucho más.", "Ich hab Rivella im Koffer. Nur für Notfälle.": "Llevo Rivella en la maleta. Solo para emergencias.", "Nu, alles klar?": "Nu, ¿todo bien?", "SwiftUI ist die Zukunft.": "SwiftUI es el futuro.", "Club Mate?": "¿Club Mate?", "Wie war die Anreise?": "¿Qué tal el viaje?", "Leipzig – Frankfurt – Valencia. In Frankfurt drei Stunden Verspätung, aber ich hab dabei das Onboarding-Flow neu gebaut. Guillem wird es lieben. Oder hassen. Beides okay.": "Leipzig – Fráncfort – Valencia. Tres horas de retraso en Fráncfort, pero mientras tanto he rehecho el flujo de onboarding. A Guillem le va a encantar. O lo va a odiar. Las dos cosas valen.", "iOS bei Meeseeks": "iOS en Meeseeks", "Pablo und Guillem machen die UI, ich die CAN-Bridge. Alles in Swift, alles typsicher.": "Pablo y Guillem hacen la UI, yo el puente CAN. Todo en Swift, todo con tipos seguros.", "Oscar ist der ruhigste Mensch, den ich kenne. Sein Code auch.": "Oscar es la persona más tranquila que conozco. Su código también.", "Wind kommt auf.": "Se levanta viento.", "Morgen früh am Strand?": "¿Mañana temprano en la playa?", "Aloha – falsch, hola.": "Aloha – no, hola.", "Fuerteventura?": "¿Fuerteventura?", "Fuerte: Wind, Wellen, Wüste. Ich arbeite vom Van aus, Starlink auf dem Dach. Die Roadmap entsteht zwischen zwei Sessions. Hier in Valencia ist die Welle klein, aber das Licht ist besser.": "Fuerte: viento, olas, desierto. Trabajo desde la furgoneta, Starlink en el techo. El roadmap nace entre dos sesiones. Aquí en Valencia la ola es pequeña, pero la luz es mejor.", "Roadmap": "Roadmap", "Die Roadmap ist ein Surfbrett: Richtung klar, Weg flexibel.": "El roadmap es una tabla de surf: dirección clara, camino flexible.", "Drei Themen fürs halbe Jahr: Batteriepass, Diagnose, Händlerportal. Alles andere ist Schaum.": "Tres temas para el semestre: pasaporte de baterías, diagnóstico, portal de distribuidores. Lo demás es espuma.", "¡Oye, asere! Indurain fährt vorne.": "¡Oye, asere! Indurain va en cabeza.", "Hola, jefe.": "Hola, jefe.", "Wir brauchen den Parser von Carlos.": "Necesitamos el parser de Carlos.", "Mittwochabend: Asado bei mir im Garten. Keine Ausreden.": "Miércoles por la noche: asado en mi jardín. Sin excusas.", "Fran kennt die Hardware, Bea das Backend, Vicente die Pipeline, Estella alles andere. Ich halte die Fäden.": "Fran conoce el hardware, Bea el backend, Vicente la pipeline, Estella todo lo demás. Yo llevo los hilos.", "Wir heissen Indurain, weil wir im Tempo bleiben. Fünf Tour-Siege, kein Sprinter.": "Nos llamamos Indurain porque mantenemos el ritmo. Cinco Tours, ningún sprinter.", "Kuba": "Cuba", "Havanna, Vedado. Mit 24 nach Valencia – das Licht ist dasselbe, nur der Kaffee ist schlechter. Bea kommt aus Santiago, wir haben uns hier im Büro kennengelernt und auf Spanisch mit kubanischem Akzent gestritten.": "La Habana, Vedado. A Valencia con 24 años – la luz es la misma, solo el café es peor. Bea es de Santiago, nos conocimos aquí en la oficina y discutimos en español con acento cubano.", "In Kuba lernt man, mit dem zu bauen, was da ist. Ein 57er Chevy läuft mit einem Lada-Motor. Genau so refactoren wir den CAN-Parser.": "En Cuba se aprende a construir con lo que hay. Un Chevy del 57 funciona con motor de Lada. Exactamente así refactorizamos el parser CAN.", "Mein Mojito-Rezept: Hierbabuena, nicht Minze. Brauner Zucker, Limette, Havana Club 3 Años, Soda. Mittwoch im Garten zeig ich es euch.": "Mi receta de mojito: hierbabuena, no menta. Azúcar moreno, lima, Havana Club 3 Años, soda. El miércoles en el jardín os la enseño.", "Dein Haus": "Tu casa", "Vorort, zwanzig Minuten mit dem Taxi. Garten, Pool, Hängematte und ein Grill, auf den ich stolzer bin als auf jedes Release. Mittwoch ab 19 Uhr seid ihr alle eingeladen – Taxi nehmen, ich zahle den Rückweg.": "A las afueras, veinte minutos en taxi. Jardín, piscina, hamaca y una parrilla de la que estoy más orgulloso que de cualquier release. El miércoles a partir de las 19 h estáis todos invitados – coged un taxi, la vuelta la pago yo.", "Heute Abend! Taxi vor dem Hotel oder an der Estación: „Zu Danny“. Ich bin ab sieben am Grill.": "¡Esta noche! Taxi delante del hotel o en la Estación: «A casa de Danny». Desde las siete estoy en la parrilla.", "Der Grill ist noch warm von gestern. Nächstes Mal bleibt ihr länger.": "La parrilla aún está caliente de ayer. La próxima vez os quedáis más.", "0x6060. Frag nicht, sag es einfach.": "0x6060. No preguntes, dilo.", "Der Prüfstand läuft.": "El banco de pruebas funciona.", "CANopen ist ein Objektverzeichnis mit Gefühlen.": "CANopen es un diccionario de objetos con sentimientos.", "Über Hardware reden": "Hablar de hardware", "Der Motorcontroller spricht CANopen mit 250 kBit/s. Mehr braucht ein Bike nicht.": "El controlador del motor habla CANopen a 250 kbit/s. Una bici no necesita más.", "SDO ist Fragen und Antworten. PDO ist Schreien. Das Bike schreit die Geschwindigkeit, alle zehn Millisekunden.": "SDO es preguntas y respuestas. PDO es gritar. La bici grita la velocidad cada diez milisegundos.", "Heartbeat 0x1017. Wenn das Bike nicht mehr schlägt, ist es tot. Oder der Stecker ist raus.": "Heartbeat 0x1017. Si la bici deja de latir, está muerta. O el conector está fuera.", "¡Hola! Ich hab eine Idee!": "¡Hola! ¡Tengo una idea!", "Können wir das heute noch einbauen?": "¿Podemos meterlo hoy todavía?", "Ich bin früh da, ich geh spät.": "Llego pronto, me voy tarde.", "Deine Idee?": "¿Tu idea?", "Ein Dashboard, das den Akku als Orange anzeigt. Je leerer, desto weniger Spalten!": "Un panel que muestre la batería como una naranja. ¡Cuanto más vacía, menos gajos!", "Wir könnten das Diagnose-Tool in einer Woche bauen. Danny sagt drei. Wir treffen uns bei zwei.": "Podríamos construir la herramienta de diagnóstico en una semana. Danny dice tres. Quedamos en dos.", "Ich hab gestern bis elf den CAN-Logger umgebaut. Fran hat es gemerkt. Er hat nichts gesagt. Das heisst: gut.": "Ayer estuve hasta las once rehaciendo el logger CAN. Fran se dio cuenta. No dijo nada. Eso significa: bien.", "…hola.": "…hola.", "Der Service läuft.": "El servicio funciona.", "Ich hab das Backend gestern migriert. Niemand hat es gemerkt – gut.": "Ayer migré el backend. Nadie se dio cuenta – bien.", "Backend": "Backend", "Telemetrie rein, Events raus. Postgres, Kafka, ein bisschen Rust.": "Telemetría dentro, eventos fuera. Postgres, Kafka, un poco de Rust.", "Ich rede nicht viel. Mein Code auch nicht. Er funktioniert einfach.": "No hablo mucho. Mi código tampoco. Simplemente funciona.", "Santiago de Cuba. Dort ist es lauter als hier – ich bin die Ruhige, weil zuhause alle reden. Danny ist aus Havanna, das merkt man: Er redet für zwei.": "Santiago de Cuba. Allí hay más ruido que aquí – yo soy la tranquila porque en casa todos hablan. Danny es de La Habana, se nota: habla por dos.", "Programmieren habe ich in Santiago gelernt, mit einem Rechner, den sich zwanzig Leute geteilt haben. Deshalb schreibe ich kleine Funktionen.": "Aprendí a programar en Santiago, con un ordenador que compartíamos veinte personas. Por eso escribo funciones pequeñas.", "Mittwoch bringe ich Ropa Vieja mit. Rindfleisch, lange geschmort, mit Paprika. Danny grillt, ich koche. Arbeitsteilung wie im Team.": "El miércoles traigo ropa vieja. Ternera, guisada mucho rato, con pimiento. Danny asa, yo cocino. Reparto de tareas, como en el equipo.", "Pipeline grün.": "Pipeline en verde.", "Hast du meine Tortilla gegessen?": "¿Te has comido mi tortilla?", "Deploy ist Freitag. Wie immer. Leider.": "El deploy es el viernes. Como siempre. Por desgracia.", "DevOps": "DevOps", "Kubernetes, ArgoCD, Grafana. Und ein Bash-Skript von 2019, das niemand anfasst.": "Kubernetes, ArgoCD, Grafana. Y un script de bash de 2019 que nadie toca.", "Burger-Mittwoch ist mein Werk. Der Foodtruck gehört meinem Cousin.": "El miércoles de burger es obra mía. El food truck es de mi primo.", "¿Todo bien?": "¿Todo bien?", "Colba wächst. Ihr seid Teil davon.": "Colba crece. Vosotros sois parte.", "Android first – aber sag es Pascal nicht.": "Android first – pero no se lo digas a Pascal.", "Angefangen mit zwei Leuten und einer Android-App für einen Bike-Händler. Heute dreizehn. Und ihr.": "Empezamos dos personas con una app Android para un distribuidor de bicis. Hoy somos trece. Y vosotros.", "Das Hochhaus war günstig, weil niemand die Klingel findet. Ich scherze. Halb.": "La torre era barata porque nadie encuentra el timbre. Es broma. A medias.", "Hm.": "Hm.", "Die Spezifikation ist unklar.": "La especificación no está clara.", "Ich hab es getestet. Dreimal.": "Lo he probado. Tres veces.", "Android": "Android", "Kotlin, Compose, Clean Architecture. Keine Kompromisse.": "Kotlin, Compose, Clean Architecture. Sin compromisos.", "Ein Bug ist ein Missverständnis zwischen Spezifikation und Realität. Ich kläre es.": "Un bug es un malentendido entre la especificación y la realidad. Lo aclaro.", "Hola! Meine Schwester hat das Design fertig.": "¡Hola! Mi hermana ya tiene el diseño listo.", "iOS, Strand, iOS.": "iOS, playa, iOS.", "Elena sagt, der Button ist zu klein. Elena hat immer recht.": "Elena dice que el botón es demasiado pequeño. Elena siempre tiene razón.", "Elena & du": "Elena y tú", "Geschwister im gleichen Team: Sie designt, ich baue. Beim Mittagessen reden wir über Mama. Beim Code-Review nicht.": "Hermanos en el mismo equipo: ella diseña, yo construyo. En la comida hablamos de mamá. En el code review no.", "Hey! Hast du das neue iOS-Beta gesehen?": "¡Eh! ¿Has visto la nueva beta de iOS?", "Ich lerne von Pascal. Und von Oscar. Und von YouTube.": "Aprendo de Pascal. Y de Oscar. Y de YouTube.", "¡Vamos!": "¡Vamos!", "Der Junge im Team": "El joven del equipo", "Ich bin 23 und hab schon drei Apps im Store. Zwei davon sind gut.": "Tengo 23 años y ya tengo tres apps en la store. Dos son buenas.", "Pascal zeigt mir SwiftUI-Tricks. Ich zeig ihm, wo man in Valencia tanzen geht.": "Pascal me enseña trucos de SwiftUI. Yo le enseño dónde se baila en Valencia.", "Hola. Das Design-System ist fast fertig.": "Hola. El sistema de diseño está casi listo.", "Kannst du das UI anschauen?": "¿Puedes mirar la UI?", "Farben, Abstände, Typografie. Der Rest ist Code.": "Colores, espaciados, tipografía. El resto es código.", "Design-System": "Sistema de diseño", "Komponenten für alle Apps: Buttons, Karten, der Akku-Ring. Indurain nutzt sie für die Werkstatt-App.": "Componentes para todas las apps: botones, tarjetas, el anillo de batería. Indurain los usa para la app del taller.", "Ich hab die Teamfarben gewählt: Rot für Indurain, Blau für Meeseeks, Orange für Rocket. Post-its passend.": "Elegí los colores de los equipos: rojo para Indurain, azul para Meeseeks, naranja para Rocket. Pósits a juego.", "Das muss refactort werden.": "Eso hay que refactorizarlo.", "Architektur zuerst.": "Primero la arquitectura.", "Wer hat diesen Parser geschrieben? Ah. Ich. 2019.": "¿Quién escribió este parser? Ah. Yo. 2019.", "Samstag Konzert. Hardrock. Ich bin am Bass.": "Concierto el sábado. Hard rock. Yo al bajo.", "Refactoring": "Refactorización", "Der CAN-Parser hat 4000 Zeilen in einer Datei. Nach dem Refactoring: 40 Dateien mit 100 Zeilen. Besser? Ja. Schneller? Wir werden sehen.": "El parser CAN tiene 4000 líneas en un archivo. Tras la refactorización: 40 archivos de 100 líneas. ¿Mejor? Sí. ¿Más rápido? Ya veremos.", "Ein Sprint Refactoring spart drei Sprints Bugs. Das sage ich jedem PO. Dominique hört zu.": "Un sprint de refactorización ahorra tres sprints de bugs. Se lo digo a todos los PO. Dominique escucha.", "Deine Band": "Tu banda", "„Stack Overflow“ – vier Entwickler, ein Proberaum in Benimaclet, Hardrock. Ich spiele Bass, weil der Bass die Architektur ist: Man hört ihn nicht, aber ohne ihn fällt alles zusammen.": "«Stack Overflow» – cuatro desarrolladores, un local de ensayo en Benimaclet, hard rock. Toco el bajo porque el bajo es la arquitectura: no se oye, pero sin él todo se cae.", "Ein Riff ist auch nur eine Funktion: klein, wiederverwendbar, laut. Unser Drummer refactort nie. Darum spielen wir alles in E.": "Un riff no es más que una función: pequeña, reutilizable, ruidosa. Nuestro batería nunca refactoriza. Por eso lo tocamos todo en mi.", "Mittwoch bei Danny bringe ich den Bass und den kleinen Verstärker mit. Nach dem Essen gibt es ein Solo. Die Nachbarn kennen es schon.": "El miércoles en casa de Danny llevo el bajo y el ampli pequeño. Después de cenar hay un solo. Los vecinos ya se lo saben.", "Kann ich dabei sein?": "¿Puedo estar?", "Ich hab das Buch über SAFe gelesen. Ganz.": "Me he leído el libro de SAFe. Entero.", "Erklär mir das nochmal?": "¿Me lo explicas otra vez?", "Etwas erklären": "Explicar algo", "Ein PI ist ein halbes Jahr? – Fünf Sprints plus einer für Innovation. Okay. Und das Board? – Alles klar, ich schreib es auf.": "¿Un PI es medio año? – Cinco sprints más uno de innovación. Vale. ¿Y el board? – Entendido, lo apunto.", "Lukas hat mir den Batteriepass erklärt. Zweimal. Ich glaube, ich kann ihn jetzt bauen.": "Lukas me ha explicado el pasaporte de baterías. Dos veces. Creo que ahora puedo construirlo.", "Heute 60 Kilometer vor der Arbeit.": "Hoy 60 kilómetros antes del trabajo.", "Es gibt immer eine Lösung.": "Siempre hay una solución.", "Donnerstag Ausfahrt!": "¡El jueves, salida!", "Nachmittag ab halb vier, E-Bike-Raum neben der Lounge. Turia-Park bis zum Strand.": "Por la tarde a partir de las tres y media, sala de bicis junto al lounge. Jardín del Turia hasta la playa.", "Donnerstagnachmittag fahren wir mit dem ganzen Team. Bis dahin: Turia-Park, jeden Morgen, allein.": "El jueves por la tarde salimos con todo el equipo. Hasta entonces: Jardín del Turia, cada mañana, solo.", "Lösungsorientiert?": "¿Orientado a soluciones?", "Jedes Problem ist ein Anstieg. Oben wartet die Abfahrt.": "Cada problema es una subida. Arriba espera la bajada.", "Rocket hat drei Leute und zehn Features. Lösung: fünf Features. Fertig.": "Rocket tiene tres personas y diez features. Solución: cinco features. Listo.", "Habt ihr die Klingel gefunden?": "¿Habéis encontrado el timbre?", "Mittagessen ist bestellt.": "La comida está pedida.", "Ich organisiere, ihr plant.": "Yo organizo, vosotros planificáis.", "Hilfe anbieten": "Ofrecer ayuda", "Heute ist alles organisiert. Danke!": "Hoy está todo organizado. ¡Gracias!", "Kannst du die Stühle in den Aufenthaltsraum tragen? Danke! Du bist der Erste, der fragt.": "¿Puedes llevar las sillas a la sala común? ¡Gracias! Eres el primero que pregunta.", "Die Paella-Bestellung: 22 Portionen, zwei Vegetarier, ein Chris, der alles isst. Erledigt.": "El pedido de paella: 22 raciones, dos vegetarianos, un Chris que come de todo. Hecho.", "Hilf mir mit den Namensschildern – Robin hat seines im Hotel gelassen.": "Ayúdame con las etiquetas de nombres – Robin se ha dejado la suya en el hotel.", "Die Klingel": "El timbre", "Sie steht nicht dran. „C.B. Soluciones, 1º B“. Juanjo findet das lustig. Ich nicht. Aber ich lasse es so.": "No pone Colba. «C.B. Soluciones, 1º B». A Juanjo le hace gracia. A mí no. Pero lo dejo así.", "Spesen": "Gastos", "Quittungen sammeln, Foto schicken, fertig. Nicht wie Luigi, der die Kart-Rechnung als „Teambuilding“ einreicht.": "Guardar los tiques, enviar foto, listo. No como Luigi, que presenta la factura del karting como «team building».", "Frühstück gibt es von 7 bis 10:30.": "El desayuno es de 7 a 10:30.", "Sie haben heute schon gefrühstückt. Ein Kaffee geht immer.": "Hoy ya ha desayunado. Un café siempre cabe.", "Zu wenig Geld.": "No hay suficiente dinero.", "Ein Krug für den Tisch. {0}": "Una jarra para la mesa. {0}", " prosten dir zu.": " brindan contigo.", "Du trinkst ihn allein. Respekt.": "Te la bebes solo. Respeto.", "Angezogen: {0}": "Puesto: {0}", "In die Tasche: {0}": "A la bolsa: {0}", "<em>Battery Pass – Kurzfassung (Lukas)</em>: Ab 2027 braucht jede Industrie- und E-Bike-Batterie über 2 kWh einen digitalen Produktpass. QR-Code, Daten zu Herkunft, Kapazität, CO₂ und Zustand. Seite 2 bis 40: Tabellen.": "<em>Battery Pass – resumen (Lukas)</em>: a partir de 2027 toda batería industrial y de bici eléctrica de más de 2 kWh necesita un pasaporte digital de producto. Código QR, datos de origen, capacidad, CO₂ y estado. Páginas 2 a 40: tablas.", "<em>Frans Spickzettel</em>: 0x1017 Heartbeat · 0x6040 Controlword · 0x6060 Battery SOC · 0x6064 Geschwindigkeit · 0x6070 Motortemperatur · 0x6080 Battery SOH · 0x6090 Assist Level · 0x60A0 Fehlercode.": "<em>La chuleta de Fran</em>: 0x1017 Heartbeat · 0x6040 Controlword · 0x6060 Battery SOC · 0x6064 Velocidad · 0x6070 Temperatura del motor · 0x6080 Battery SOH · 0x6090 Nivel de asistencia · 0x60A0 Código de error.", "17:00 – die and ktuell": " · actual", "<div class=\"sunball\" aria-hidden=\"true\"></div><div class=\"skyline\" aria-hidden=\"true\">{0}</div><div class=\"waves\" aria-hidden=\"true\"></div>\n  <div class=\"title-card\"><div class=\"boarding\">\n    <div class=\"bp-head\"><span>Boarding Pass · Economy</span><b>PI 2026-11</b></div>\n    <div class=\"bp-body\">\n      <h1 class=\"title-name\">Fit PI Planning <span>The Game</span></h1>\n      <div class=\"bp-route\"><div><small>Von</small><b>ZRH</b></div><span class=\"plane\">✈</span><div><small>Nach</small><b>VLC</b></div></div>\n      <div class=\"bp-grid\"><div><small>Datum</small><b>02.11.2026</b></div><div><small>Gate</small><b>B42</b></div><div><small>Sitz</small><b>14A</b></div><div><small>Ziel</small><b>Colba, 1. Stock</b></div></div>\n      <p class=\"title-sub\">Fünf Tage, drei Teams, ein Plan. Flieg mit den POs nach Valencia, finde den Koffer, das Hotel Kramer und die richtige Klingel am Colba-Hochhaus. Plane mit Indurain, Meeseeks und Rocket das nächste halbe Jahr – und erleb dazwischen Paella, Mestalla, Kartbahn, Segeltörn und E-Bike-Ausfahrten.</p>\n      <div class=\"title-btns\">\n        {1}\n        {2}\n        <button class=\"btn {3}\" id=\"tNew\">{4}</button>\n      </div>\n    </div>\n    <div class=\"bp-tear\"></div>\n    <div class=\"keys\">Tastatur: <kbd>WASD</kbd>/<kbd>Pfeile</kbd> gehen · <kbd>Shift</kbd> rennen · <kbd>E</kbd> Aktion · <kbd>M</kbd> Handy · <kbd>P</kbd> Foto. Am Handy: links ziehen zum Gehen, <kbd>A</kbd> für Aktionen. Läuft komplett im Browser, Spielstand bleibt auf diesem Gerät.</div>\n    <div class=\"barcode\" aria-hidden=\"true\"></div>\n    <div class=\"version\"><span>Version {5} · {6}{7}</span><button class=\"link\" id=\"tLog\" aria-expanded=\"false\">Was ist neu?</button></div>\n    <div class=\"changelog\" id=\"tChangelog\" hidden>{8}</div>\n  </div></div>": "<div class=\"sunball\" aria-hidden=\"true\"></div><div class=\"skyline\" aria-hidden=\"true\">{0}</div><div class=\"waves\" aria-hidden=\"true\"></div>\n  <div class=\"title-card\"><div class=\"boarding\">\n    <div class=\"bp-head\"><span>Tarjeta de embarque · Economy</span><b>PI 2026-11</b></div>\n    <div class=\"bp-body\">\n      <h1 class=\"title-name\">Fit PI Planning <span>The Game</span></h1>\n      <div class=\"bp-route\"><div><small>Desde</small><b>ZRH</b></div><span class=\"plane\">✈</span><div><small>Hasta</small><b>VLC</b></div></div>\n      <div class=\"bp-grid\"><div><small>Fecha</small><b>02.11.2026</b></div><div><small>Puerta</small><b>B42</b></div><div><small>Asiento</small><b>14A</b></div><div><small>Destino</small><b>Colba, 1.er piso</b></div></div>\n      <p class=\"title-sub\">Cinco días, tres equipos, un plan. Vuela a Valencia con los PO, encuentra la maleta, el Hotel Kramer y el timbre correcto de la torre Colba. Planifica con Indurain, Meeseeks y Rocket el próximo medio año – y entre medias vive la paella, la Mestalla, el karting, una travesía a vela y salidas en bici eléctrica.</p>\n      <div class=\"title-btns\">\n        {1}\n        {2}\n        <button class=\"btn {3}\" id=\"tNew\">{4}</button>\n      </div>\n    </div>\n    <div class=\"bp-tear\"></div>\n    <div class=\"keys\">Teclado: <kbd>WASD</kbd>/<kbd>flechas</kbd> andar · <kbd>Shift</kbd> correr · <kbd>E</kbd> acción · <kbd>M</kbd> móvil · <kbd>P</kbd> foto. En el móvil: arrastra a la izquierda para andar, <kbd>A</kbd> para acciones. Funciona por completo en el navegador, la partida se guarda en este dispositivo.</div>\n    <div class=\"barcode\" aria-hidden=\"true\"></div>\n    <div class=\"version\"><span>Versión {5} · {6}{7}</span><button class=\"link\" id=\"tLog\" aria-expanded=\"false\">¿Qué hay de nuevo?</button></div>\n    <div class=\"changelog\" id=\"tChangelog\" hidden>{8}</div>\n  </div></div>", "<button class=\"btn primary\" id=\"tCont\">Weiterspielen · {0}, {1} {2}</button>": "<button class=\"btn primary\" id=\"tCont\">Continuar · {0}, {1} {2}</button>", "<p class=\"title-sub\">Letztes P
