<style>
:root {

}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0e1116; color: var(--ink); font-family: var(--f-body); font-size: 15px; }
body { min-height: 100vh; background: radial-gradient(1200px 500px at 50% -200px, #2a3a6a 0%, #0e1116 70%) fixed; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 18px; }

h1 small { display: block; font-family: var(--f-sign); font-weight: 500; font-size: 15px; color: var(--dim); letter-spacing: 0.3px; margin-top: 4px; }
.head-r { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font-family: var(--f-sign); font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--board-2); border: 1px solid var(--line); color: var(--dim); display: inline-flex; align-items: center; gap: 8px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
.pill.live i { background: var(--ok); animation: pulse 2s infinite; }
.pill.err i { background: var(--bad); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(108, 196, 111, 0.55); } 70% { box-shadow: 0 0 0 8px rgba(108, 196, 111, 0); } 100% { box-shadow: 0 0 0 0 rgba(108, 196, 111, 0); } }
button { font-family: var(--f-sign); font-weight: 600; font-size: 14px; color: var(--ink); background: var(--board-3); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--amber); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
select, input { font-family: var(--f-body); font-size: 14px; color: var(--ink); background: var(--board-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { background: var(--board); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile small { display: block; font-family: var(--f-sign); color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; }
.tile b { font-family: var(--f-pixel); font-size: 26px; color: var(--ink); font-weight: 700; }
.tile b em { font-style: normal; font-size: 15px; color: var(--dim); margin-left: 4px; }
h2 { font-family: var(--f-sign); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: var(--amber); margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
h2 .tools { margin-left: auto; display: flex; gap: 8px; text-transform: none; letter-spacing: 0; font-weight: 500; }
.boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.board { background: var(--board); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.board h3 { margin: 0 0 8px; font-family: var(--f-sign); font-size: 14px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.6px; }
.board ol { margin: 0; padding: 0; list-style: none; counter-reset: r; }
.board li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px dashed #26305a; font-size: 14px; }
.board li:first-child { border-top: 0; }
.board li::before { counter-increment: r; content: counter(r); font-family: var(--f-pixel); color: var(--amber); width: 16px; }
.board li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board li b { font-family: var(--f-pixel); font-weight: 500; }
.board .empty { color: var(--dim); font-size: 14px; }
.h2note { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--dim); text-transform: none; letter-spacing: 0; }
.devtag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 5px; font-size: 12px; font-weight: 600; vertical-align: 1px; background: #2c3a66; color: #d4e2f8; }
.devtag.os { background: none; color: var(--dim); font-weight: 400; padding: 0; }
.ended { display: flex; flex-direction: column; gap: 8px; }
.endrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--board); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.por.sm { width: 44px; height: 44px; border-radius: 8px; }
.endwho b { font-family: var(--f-pixel); font-size: 17px; font-weight: 700; }
.endres { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.endres small { color: var(--dim); font-size: 12.5px; }
.endnums { display: grid; grid-template-columns: repeat(5, minmax(64px, auto)); gap: 6px; text-align: center; }
.endnums span { background: #10162a; border: 1px solid #26305a; border-radius: 8px; padding: 4px 6px; }
.endnums b { display: block; font-family: var(--f-pixel); font-size: 14px; font-weight: 700; white-space: nowrap; }
.endnums small { color: var(--dim); font-size: 11px; white-space: nowrap; }
@media (max-width: 640px) { .endrow { grid-template-columns: auto minmax(0, 1fr); } .endnums { grid-column: 1 / -1; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; } .endnums span { min-width: 0; padding: 4px 2px; } .endnums b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; } .endnums small { display: block; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.card { background: linear-gradient(180deg, var(--board-2), var(--board)); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.on { border-color: #3c6a48; }
.top { display: flex; gap: 12px; align-items: center; }
.por { width: 72px; height: 72px; border-radius: 10px; background: #2a3a52; flex: none; image-rendering: pixelated; border: 2px solid var(--line); }
.who { min-width: 0; flex: 1; }
.who b { font-family: var(--f-pixel); font-size: 20px; font-weight: 700; display: block; line-height: 1.15; }
.who .role { color: var(--dim); font-size: 13px; }
.dev { font-size: 13px; color: var(--dim); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #56627a; display: inline-block; flex: none; }
.dot.on { background: var(--ok); }
.lbl { color: var(--ink); font-weight: 600; }
.edit { background: none; border: 0; padding: 0 2px; color: var(--dim); font-size: 13px; }
.edit:hover { color: var(--amber); }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-family: var(--f-sign); font-size: 12.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--board-3); border: 1px solid var(--line); color: var(--dim); }
.badge.fin { color: #141a2e; background: var(--ok); border-color: var(--ok); }
.badge.over { color: #fff; background: #6a2028; border-color: var(--bad); }
.badge.team { color: #fff; }
.prog { display: flex; flex-direction: column; gap: 6px; }
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.track span { height: 6px; border-radius: 3px; background: #26305a; }
.track span.done { background: var(--amber); }
.track span.cur { background: linear-gradient(90deg, var(--amber), #ffe08a); box-shadow: 0 0 8px rgba(240, 162, 58, 0.6); }
.prog .where { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.prog .where b { font-family: var(--f-sign); font-weight: 600; font-size: 15px; }
.prog .where small { color: var(--dim); text-align: right; }
.days { display: flex; gap: 3px; }
.days i { flex: 1; height: 14px; border-radius: 3px; background: #1a2240; border: 1px solid #26305a; font-style: normal; font-size: 9px; text-align: center; line-height: 12px; color: #55639a; font-family: var(--f-pixel); }
.days i.done { background: #2f4a3a; border-color: #3c6a48; color: #a8d8aa; }
.days i.cur { background: var(--amber); border-color: var(--amber); color: #141a2e; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 8px; align-items: center; font-size: 13px; }
.bars small { color: var(--dim); }
.bar { height: 7px; border-radius: 4px; background: #26305a; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.bars b { font-family: var(--f-pixel); font-weight: 500; font-size: 13px; text-align: right; min-width: 44px; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.num { background: #10162a; border: 1px solid #26305a; border-radius: 8px; padding: 6px 4px; text-align: center; min-width: 0; }
.num b { display: block; font-family: var(--f-pixel); font-size: 17px; font-weight: 700; }
.num small { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
.evs { display: flex; flex-direction: column; gap: 6px; }
.evhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.evhead b { font-family: var(--f-sign); font-weight: 600; font-size: 14px; color: var(--dim); }
.evhead small { color: var(--dim); }
.evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 4px; }
.ev { position: relative; display: flex; align-items: center; gap: 5px; min-width: 0; padding: 4px 6px; border-radius: 7px; background: #10162a; border: 1px solid #1f2848; opacity: 0.45; filter: grayscale(1); }
.ev.on { opacity: 1; filter: none; background: #2a2a18; border-color: #6a5a24; }
.ev i { font-style: normal; font-size: 14px; flex: none; }
.ev em { font-style: normal; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev sup { position: absolute; top: -6px; right: -3px; font-size: 10px; font-family: var(--f-pixel); background: var(--amber); color: #141a2e; border-radius: 6px; padding: 0 4px; }
details { border-top: 1px solid #26305a; padding-top: 8px; }
summary { cursor: pointer; font-family: var(--f-sign); font-weight: 600; color: var(--dim); font-size: 14px; }
summary:hover { color: var(--ink); }
.log { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; max-height: 220px; overflow: auto; }
.log li { display: grid; grid-template-columns: 92px 1fr; gap: 8px; padding: 3px 0; border-top: 1px dashed #26305a; }
.log li small { color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chips span { font-size: 12px; padding: 2px 7px; border-radius: 5px; background: #26305a; }
.games { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
.games li { padding: 3px 0; border-top: 1px dashed #26305a; display: flex; justify-content: space-between; gap: 8px; }
.games li small { color: var(--dim); }
.setup { background: var(--board); border: 1px solid var(--line); border-radius: 14px; padding: 18px; max-width: 760px; }
.setup p, .setup li { color: var(--dim); line-height: 1.5; }
.setup code, .setup pre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--ink); background: #0a0e1a; border-radius: 6px; }
.setup code { padding: 1px 5px; }
.setup pre { padding: 10px 12px; overflow: auto; }
.setup form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.setup input { flex: 1; min-width: 240px; }
.msg { color: var(--dim); padding: 30px 0; text-align: center; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 23px; } .nums { grid-template-columns: repeat(4, 1fr); } }
</style>

sche Seidenbörse (1482–1548) mit ihrer Säulenhalle ist seit 1996 UNESCO-Welterbe – ein Zeugnis der Handelsmacht Valencias im 15. Jahrhundert.": "The late-Gothic silk exchange (1482–1548) with its pillared hall has been a UNESCO World Heritage Site since 1996 – testimony to Valencia's trading power in the 15th century.", "Torres de Serranos": "Torres de Serranos", "Stadttor von 1392–1398, eines der besterhaltenen gotischen Stadttore Europas. Von hier wird Ende Februar mit der „Crida“ die Fallas-Zeit eröffnet.": "City gate from 1392–1398, one of the best-preserved Gothic city gates in Europe. At the end of February the Fallas season opens here with the \"Crida\".", "Mercado Central": "Mercado Central", "Die modernistische Markthalle wurde 1928 eröffnet und gehört zu den grössten Europas. Unter der Kuppel: Fisch, Jamón, Gemüse, Safran – und die Horchata-Bar.": "The modernist market hall opened in 1928 and is one of the largest in Europe. Under the dome: fish, jamón, vegetables, saffron – and the horchata bar.", "Jardín del Turia": "Jardín del Turia", "Nach der Flutkatastrophe von 1957 wurde der Fluss Turia umgeleitet. Im alten Flussbett entstand ein neun Kilometer langer Park, eröffnet 1986 – das Lieblingsrevier aller Velofahrer.": "After the flood disaster of 1957 the river Turia was diverted. A nine-kilometre park was created in the old riverbed, opened in 1986 – every cyclist's favourite territory.", "Playa de la Malvarrosa": "Playa de la Malvarrosa", "Der breite Stadtstrand mit Promenade. Der Maler Joaquín Sorolla hat hier das Licht Valencias auf die Leinwand gebracht.": "The wide city beach with its promenade. The painter Joaquín Sorolla captured the light of Valencia on canvas here.", "La Marina de València": "La Marina de València", "Der Hafen wurde für den America’s Cup 2007 umgebaut. Heute: Segelboote, Veles e Vents und Konzerte am Wasser.": "The harbour was rebuilt for the 2007 America's Cup. Today: sailing boats, Veles e Vents and concerts by the water.", "Plaza de la Virgen": "Plaza de la Virgen", "Der Turia-Brunnen zeigt den Flussgott mit acht Frauen – den acht Bewässerungskanälen der Huerta. Jeden Donnerstag um 12 Uhr tagt hier das Wassergericht, das älteste Gericht Europas (UNESCO 2009).": "The Turia fountain shows the river god with eight women – the eight irrigation channels of the Huerta. Every Thursday at noon the Water Tribunal, the oldest court in Europe (UNESCO 2009), sits here.", "Plaza del Ayuntamiento": "Plaza del Ayuntamiento", "Während der Fallas (1.–19. März) knallt hier jeden Tag um 14 Uhr die Mascletà: Minuten lang Böller, bis der Boden bebt.": "During the Fallas (1–19 March) the Mascletà goes off here every day at 2 pm: minutes of firecrackers until the ground shakes.", "Museu de Belles Arts": "Museu de Belles Arts", "Eines der bedeutendsten Kunstmuseen Spaniens: Sorolla, Goya, El Greco und ein Selbstporträt von Velázquez hängen hier.": "One of the most important art museums in Spain: Sorolla, Goya, El Greco and a self-portrait by Velázquez hang here.", "Estación del Norte": "Estación del Norte", "Modernistischer Bahnhof von 1917, verziert mit Orangen, Azulejos und Mosaiken – Valencias schönste Visitenkarte.": "Modernist railway station from 1917, decorated with oranges, azulejos and mosaics – Valencia's most beautiful calling card.", "Falla-Monument": "Falla monument", "Die riesigen Figuren aus Holz und Pappmaché werden monatelang gebaut – und in der Nacht des 19. März bei der Cremà verbrannt. Nur ein Ninot wird jedes Jahr begnadigt.": "The giant figures of wood and papier-mâché are built over months – and burned on the night of 19 March at the Cremà. Only one ninot is pardoned each year.", "Colba-Hochhaus": "Colba tower", "Im ersten Stock entwickelt Colba die E-Bike-Apps. Die Klingel ist angeschrieben – trotzdem weiss niemand, welche die richtige ist.": "On the first floor Colba develops the e-bike apps. The doorbell is labelled – and still nobody knows which one is right.", "Gepäck gefunden": "Lu n the team room at Colba", "im Aufenthaltsraum bei Colba": "in the lounge at Colba", "auf dem Balkon (raucht)": "on the balcony (smoking)", "am Backoffice-Pult": "at the back office desk", "im E-Bike-Raum neben der Lounge": "in the e-bike room next to the lounge", "irgendwo im Office – sucht den Weg": "somewhere in the office – looking for the way", "beim Asado in Dannys Garten": "at the asado in Danny's garden", "am Strand der Malvarrosa": "on the Malvarrosa beach", "mit dem Velo im Turia-Park": "cycling in the Turia park", "auf der Kartbahn": "at the kart track", "bei der Cremà auf der Plaza del Ayuntamiento": "at the Cremà on Plaza del Ayuntamiento", "irgendwo in Valencia": "somewhere in Valencia", "Du bist {0}, {1}. {2} Der Flieger aus Zürich ist gelandet: eine Woche PI Planning bei Colba in Valencia. Zuerst: Koffer vom Band 3 holen. Dann die anderen einsammeln – Robin ist zum ersten Mal dabei und steht garantiert am falschen Band.": "You are {0}, {1}. {2} The plane from Zurich has landed: a week of PI planning at Colba in Valencia. First: get the suitcase from belt 3. Then round up the others – Robin is here for the first time and is guaranteed to be standing at the wrong belt.", "Du bist Pascal, iOS-Spezialist aus Leipzig. Allein angereist, Rucksack voll Club Mate. Zufall: Die Zürcher sind gerade gelandet – Band 3. Hol deinen Koffer und such die Truppe, dann teilt ihr euch das Taxi ins Hotel Kramer.": "You are Pascal, iOS specialist from Leipzig. Travelled alone, backpack full of Club Mate. Coincidence: the Zurich crew has just landed – belt 3. Get your suitcase and find the crew, then share the taxi to Hotel Kramer.", "Du bist Chris, Surfer und Product Manager aus Fuerteventura. Das Brett blieb zuhause, das Wax ist im Koffer. Die Schweizer sind gerade mit dir gelandet – Band 3. Koffer holen, Truppe finden, Taxi ins Hotel Kramer.": "You are Chris, surfer and product manager from Fuerteventura. The board stayed at home, the wax is in the suitcase. The Swiss have just landed with you – belt 3. Get the suitcase, find the crew, taxi to Hotel Kramer.", "Dein Koffer ist schon da. Lukas’ Koffer fährt noch eine Ehrenrunde – er bemerkt es nicht, er liest den Batteriepass-Entwurf.": "Your suitcase is already here. Lukas' suitcase is doing a lap of honour – he doesn't notice, he's reading the battery pass draft.", "Das Band läuft weiter. Dein Koffer kommt schon noch – schau nochmal hin.": "The belt keeps running. Your suitcase will come – look again.", "Äh … das ist meiner. Sorry! Erstes Mal dabei, aber den Koffer erkenne ich.": "Er … that's mine. Sorry! First time here, but I recognise the suitcase.", "Dein Koffer! {0}Jetzt die Truppe einsammeln: {1}. Sie winken mit einem „!“ (oder rauchen, oder schauen Autos an).": "Your suitcase! {0}Now round up the crew: {1}. They wave with a \"!\" (or smoke, or look at cars).", "Beim zweiten Anlauf. ": "On the second attempt. ", "Un Seat León, un Cupra Formentor … Luigi hat den Prospekt schon dreimal gelesen. Ihr fahrt trotzdem Taxi – Simon hat eins bestellt.": "Un Seat León, un Cupra Formentor … Luigi has already read the brochure three times. You take a taxi anyway – Simon ordered one.", "Ohne die anderen fährst du nicht. Es fehlen: {0}.": "You're not leaving without the others. Missing: {0}.", "Erst den Koffer vom Band 3 holen!": "Get the suitcase from belt 3 first!", "Taxifahrer Paco": "Taxi driver Paco", "¿Hotel Kramer? Vale. Fünf Personen und fünf Koffer – das wird eng. Robin, du nimmst den Koffer auf den Schoss.": "¿Hotel Kramer? Vale. Five people and five suitcases – that'll be tight. Robin, you take the suitcase on your lap.", "Vom Flughafen in die Stadt …": "From the airport into town …", "Die Gasse zum Hotel ist zu eng für das Auto. Ich lass euch an der Plaza del Ayuntamiento raus – das Hotel ist in der Gasse Richtung Westen, zwei Blocks. ¡Buena suerte! Und um 14 Uhr: Ohren zu, Mascletà.": "The alley to the hotel is too narrow for the car. I'll drop you at Plaza del Ayuntamiento – the hotel is in the alley heading west, two blocks. ¡Buena suerte! And at 2 pm: cover your ears, Mascletà.", "Valencia! Orangenbäume, Sonne, Böllerrauch. Die anderen schleppen ihre Koffer hinterher – finde das Hotel Kramer in der Gasse westlich der Plaza (vier Sterne am Schild).": "Valencia! Orange trees, sun, firecracker smoke. The others drag their suitcases behind you – find the Hotel Kramer in the alley west of the plaza (four stars on the sign).", "Zum Flughafen (Heimflug)": "To the airport (flight home)", "Zum Hotel Kramer": "To Hotel Kramer", "Zum Strand": "To the beach", "Zu Danny (Asado, Vorort)": "To Danny's (asado, suburb)", "Doch nicht": "Never mind", "Taxifahrer": "Taxi driver", "¿A dónde? Flughafen 22 €, Stadt 9 €{0}.": "¿A dónde? Airport 22 €, city 9 €{0}.", ", Vorort 14 €": ", suburb 14 €", "Sin dinero no hay taxi.": "Sin dinero no hay taxi.", "Raus in den Vorort, zu Danny …": "Out to the suburb, to Danny's …", "Taxi durch Valencia …": "Taxi through Valencia …", "¡Bienvenidos al Hotel Kramer! Reservierung Colba, {0} Zimmer, vier Nächte. {1}: Zimmer 412, vierter Stock. Frühstück 7 bis 10:30. Der Lift ist links – und bitte nicht alle fünf auf einmal, der ist aus den Sechzigern.": "¡Bienvenidos al Hotel Kramer! Reservation Colba, {0} rooms, four nights. {1}: room 412, fourth floor. Breakfast 7 to 10:30. The lift is on the left – and please not all five at once, it's from the sixties.", "fünf": "five", "Ich hab Zimmer 414. Wer von euch kennt sich mit diesen Kartenschlössern aus?": "I've got room 414. Which of you knows how these card locks work?", "Zimmer 412 im 4. Stock: Koffer abstellen, auspacken, durchatmen. Um 17:00 treffen sich alle in der Bar Pepita an der Plaza de la Virgen – auch Pascal, Chris und Juanjo.": "Room 412 on the 4th floor: drop the suitcase, unpack, breathe. At 17:00 everyone meets at Bar Pepita on Plaza de la Virgen – Pascal, Chris and Juanjo too.", "Buenos días. Was kann ich für Sie tun?": "Buenos días. What can I do for you?", "Wo .", "Burger-Mittwoch. Vorher: Planning.": "Burger Wednesday. First: planning.", "Donnerstag: Bocadillos zum Zmittag, Ausfahrt mit dem Team am Nachmittag, abends brennen die Fallas.": "Thursday: bocadillos for lunch, ride with the team in the afternoon, the Fallas burn in the evening.", "Freitag: Healthy Breakfast im Office, um 15:00 die Final-Präsentation. Heute zählt es.": "Friday: healthy breakfast at the office, final presentation at 15:00. Today counts.", "Samstag: Heimflug um 10:00. Taxi vor dem Hotel.": "Saturday: flight home at 10:00. Taxi in front of the hotel.", "Ein neuer Tag in Valencia.": "A new day in Valencia.", "Robin hat Spesen verteilt: +60 €.": "Robin handed out expenses: +60 €.", "Du bist noch frisch.": "You're still fresh.", "Duschen …": "Showering …", "Frisch geduscht. Der Wasserdruck im Kramer ist legendär.": "Freshly showered. The water pressure at the Kramer is legendary.", "Die Kaffeemaschine läuft nur zum Frühstück (7–10:30).": "The coffee machine only runs at breakfast (7–10:30).", "Café con leche aus der Hotelmaschine. Zählt.": "Café con leche from the hotel machine. Counts.", "¡Hola! Ihr seid die Schweizer von Colba? Juanjo hat den Tisch reserviert. Agua de Valencia?": "¡Hola! You're the Swiss from Colba? Juanjo reserved the table. Agua de Valencia?", "¡Bienvenidos! Schön, dass ihr da seid. Morgen 9:30 im Office, erster Stock. Die Klingel … ach, das erklärt euch Isabel morgen. Pascal ist auch schon da – und Chris kommt gerade vom Strand.": "¡Bienvenidos! Great that you're here. Tomorrow 9:30 at the office, first floor. The doorbell … well, Isabel will explain that tomorrow. Pascal is already here too – and Chris is just coming from the beach.", "Von Leipzig über Frankfurt, drei Stunden Verspätung, aber: ich bin da. Erste Erkenntnis: Valencia hat mehr Sonne als Sachsen im ganzen Jahr.": "From Leipzig via Frankfurt, three hours late, but: I'm here. First insight: Valencia has more sun than Saxony gets all year.", "Fuerte war windstill, also hab ich nichts verpasst. Morgen früh um halb sieben am Strand – wer kommt mit?": "Fuerte had no wind, so I didn't miss anything. Tomorrow morning at half past six on the beach – who's coming?", "Ich hab die Kartbahn gesehen. Mittwochabend. Keine Diskussion.": "I've seen the kart track. Wednesday evening. No discussion.", "Ich geh kurz raus, eine rauchen. Bestellt mir einen Krug.": "I'm popping out for a smoke. Order me a jug.", "Also … ich halte morgen den Business Context. 20 Minuten. Ist das hier immer so laut?": "So … I'm giving the business context tomorrow. 20 minutes. Is it always this loud here?", "Erster Krug Agua de Valencia: Cava, Orangensaft, Wodka, Gin. Die Woche kann beginnen. Tipp: nicht zu spät ins Bett – morgen Kickoff.": "First jug of Agua de Valencia: cava, orange juice, vodka, gin. The week can begin. Tip: don't go to bed too late – kickoff tomorrow.", "Der Stammtisch der POs. Gerade leer – Pepita hat ein „Reservado“-Schild hingestellt.": "The POs' regular table. Empty right now – Pepita has put up a \"Reservado\" sign.", "Am Tisch: {0}.": "At the table: {0}.", "Hinsetzen und mittrinken": "Sit down and drink along", "Über das Planning reden": "Talk about the planning", "Weitergehen": "Move on", "Salud! Auf Valencia.": "Salud! To Valencia.", "Noch eine Caña? Die sind klein hier.": "Another caña? They're small here.", "Wusstet ihr, dass Agua de Valencia 1959 im Café Madrid erfunden wurde?": "Did you know Agua de Valencia was invented in 1959 at Café Madrid?", "Morgen früh wieder fit, versprochen.": "Fit again tomorrow morning, promise.", "Der Plan von {0} steht bei {1} %. {2}": "{0}'s plan stands at {1} %. {2}", "Da geht noch was.": "There's more to come.", "Läuft.": "Going well.", "Die Abhängigkeiten mit Rocket machen mir Sorgen. Carlos will erst refactoren.": "The dependencies with Rocket worry me. Carlos wants to refactor first.", "Fran hat heute 40 CANopen-Indexe aus dem Kopf aufgesagt. Vierzig.": "Fran recited 40 CANopen indexes from memory today. Forty.", "Robin fragt alle zehn Minuten, was ein Sprint ist. Er lernt schnell.": "Robin asks every ten minutes what a sprint is. He learns fast.", "Der Tisch der Colba-Leute. Leer – die sind bei ihren Familien, oder auf dem Mofa unterwegs.": "The Colba crowd's table. Empty – they're with their families, or out on their mopeds.", "Setz dich! Hier redet niemand über Jira.": "Sit down! Nobody talks about Jira here.", "¿Una caña? Pepita, otra ronda.": "¿Una caña? Pepita, otra ronda.", "Nach dem Planning gehen wir alle zur Cremà. Donnerstagnacht brennt alles.": "After the planning we're all going to the Cremà. Thursday night everything burns.", "Aitor fährt morgen 60 Kilometer vor der Arbeit. Mit dem Rennvelo. Wir nehmen die Metro.": "Aitor is riding 60 kilometres before work tomorrow. On the road bike. We take the metro.", "Du weisst jetzt, welche: „C.B. Soluciones, 1º B“. Die Tür summt.": "Now you know which one: \"C.B. Soluciones, 1º B\". The door buzzes.", "Das Klingelbrett. Zwölf Klingeln, alle angeschrieben – und auf keiner steht „Colba“. Isabel hat gesagt, sie steht nicht dran. Welche könnte es sein?": "The doorbell panel. Twelve bells, all labelled – and none of them says \"Colba\". Isabel said it's not on there. Which one could it be?", "Isabel (Gegensprechanlage)": "Isabel (intercom)", "¡Hola! Ihr habt es gefunden! „C.B.“ – Colba, ganz einfach. Kommt hoch, erster Stock. Lift links oder rechts, die Treppe ist in der Mitte. Der Lift rechts ist langsamer.": "¡Hola! You found it! \"C.B.\" – Colba, simple. Come up, first floor. Lift left or right, the stairs are in the middle. The right lift is slower.", "Das war die falsche Klingel. Eine Nachbarin hat dich auf Valencianisch beschimpft. Nochmal versuchen – oder Isabel anrufen (Handy → Team).": "That was the wrong bell. A neighbour told you off in Valencian. Try again – or call Isabel (phone → Team).", "Isabels Pult: Agenda, Bestellzettel, ein Teller Mandeln. Sie ist unterwegs – Mittagessen organisieren.": "Isabel's desk: agenda, order slips, a plate of almonds. She's out – organising lunch.", "Eine Handvoll Mandeln genommen.": "Took a handful of almonds.", "Dienstag 9:30": "Tuesday 9:30", "Kickoff": "Kickoff", "Business Context mit Robin": "Business context with Robin", "Guten Morgen zusammen – buenos días. Ich bin Robin, zum ersten Mal dabei, und ich habe 24 Folien. Keine Sorge, ich überspringe die Hälfte. Das nächste halbe Jahr: E-Bike-Apps, die mit dem Bike über CANopen reden. Batteriepass. OTA-Updates. Und ein Händlerportal.": "Good morning everyone – buenos días. I'm Robin, here for the first time, and I have 24 slides. Don't worry, I'll skip half of them. The next half year: e-bike apps that talk to the bike over CANopen. Battery pass. OTA updates. And a dealer portal.", "Drei Teams, drei Räume. Indurain: Hardware-Nähe und Diagnose. Meeseeks: Android und iOS. Rocket: Web, Architektur, Batteriepass. Mittags gibt es Paella. Fragen?": "Three teams, three rooms. Indurain: close to the hardware and diagnostics. Meeseeks: Android and iOS. Rocket: web, architecture, battery pass. Paella for lunch. Questions?", "Eine: Welcher Index für den Battery State of Charge? – Ich weiss es. 0x6060. Nur so.": "One: which index for the battery state of charge? – I know it. 0x6060. Just saying.", "Und bitte: die Klingel. Ich schreibe sie trotzdem nicht an. Tradition.": "And please: the doorbell. I still won't label it. Tradition.", "Agenda steht am Whiteboard. Bis Freitag 15 Uhr braucht jedes Team einen Plan mit mindestens 80 % Commitment – Features geschätzt, Risiken geroamt, Abhängigkeiten geklärt. {0}": "The agenda is on the whiteboard. By Friday 3 pm every team needs a plan with at least 80 % commitment – features estimated, risks ROAMed, dependencies sorted. {0}", "Du bist PO – dein Team schaut auf dich.": "You're the PO – your team is looking at you.", "Hilf deinem Team, wo du kannst.": "Help your team where you can.", "Dein Raum: {0}. Dort: Planning Poker am Tisch, CANopen-Quiz mit Fran (Indurain), ROAM am Flipchart, Programm-Board am Whiteboard, Dependency-Board am Bildschirm. Jede Aktivität bringt den Plan weiter – pro Tag einmal.": "Your room: {0}. There: planning poker at the table, CANopen quiz with Fran (Indurain), ROAM at the flipchart, program board at the whiteboard, dependency board on the screen. Every activity moves the plan forward – once per day.", "Der Bildschirm zeigt Robins Titelfolie: „Business Context – Colba 2026“. Er beginnt um 9:30.": "The screen shows Robin's title slide: \"Business Context – Colba 2026\". He starts at 9:30.", "Der Bildschirm zeigt „PI PLANNING“. Der Kickoff ist am Dienstag um 9:30.": "The screen shows \"PI PLANNING\". The kickoff is on Tuesday at 9:30.", "Der grosse Bildschirm: Plan-Stand aller Teams. Indurain {0} %, Meeseeks {1} %, Rocket {2} %. {3}": "The big screen: plan status of all teams. Indurain {0} %, Meeseeks {1} %, Rocket {2} %. {3}", "Final um 15:00.": "Final at 15:00.", "Final am Freitag um 15:00.": "Final on Friday at 15:00.", "Die {0} ist aufgegessen. Isabel packt die Reste ein.": "The {0} is all gone. Isabel is packing up the leftovers.", "{0} Hunger?": "{0} Hungry?", "Zugreifen!": "Dig in!", "Später": "Later", "¡Qué aproveche!": "¡Qué aproveche!", "Der Socarrat ist das Beste. Der knusprige Reis am Boden.": "The socarrat is the best part. The crispy rice at the bottom.", "Nach dem Essen: Siesta? – Nein, Planning.": "After lunch: siesta? – No, planning.", "Isabel, du bist die Beste.": "Isabel, you're the best.", "Healthy Breakfast am Freitag von 8:30 bis 10:30.": "Healthy breakfast on Friday from 8:30 to 10:30.", "Der grosse Tisch. Mittagessen von 13:00 bis 14:30: {0}.": "The big table. Lunch from 13:00 to 14:30: {0}.", "Der grosse Tisch im Aufenthaltsraum. Hier gibt es Mittagessen, Präsentationen und Diskussionen über den Socarrat.": "The big table in the lounge. This is where lunch, presentations and discussions about the socarrat happen.", "Sechs Kaffees heute. Vicente schaut besorgt.": "Six coffees today. Vicente looks worried.", "Nespresso. George Clooney wäre stolz.": "Nespresso. George Clooney would be proud.", "Kapsel rein, Knopf drücken, warten. Das Beste am Office.": "Capsule in, press the button, wait. The best thing about the office.", "Fran hat die Maschine auf CANopen umgebaut. Sagt er. Sie macht trotzdem nur Kaffee.": "Fran converted the machine to CANopen. So he says. It still only makes coffee.", "Der Kühlschrank: Wasser, Cola, ein Tupperware mit dem Namen „VICENTE – NICHT ANFASSEN“.": "The fridge: water, cola, a Tupperware labelled \"VICENTE – DO NOT TOUCH\".", "Wasser nehmen": "Take water", "Cola nehmen": "Take a cola", "Vicentes Tupperware": "Vicente's Tupperware", "Zu": "Close", "… das war meine Tortilla. Ich sag nichts. Aber ich merk es mir.": "… that was my tortilla. I won't say anything. But I'll remember.", "Ein Becher Wasser. Gut gegen Mascletà-Staub und gestern Abend.": "A cup of water. Good against Mascletà dust and last night.", "Zwanzig Minuten Sofa. Elena nennt es „Designpause“.": "Twenty minutes of sofa. Elena calls it a \"design break\".", "Hier entstehen die besten Ideen. Zum Beispiel: Rocket übernimmt das OTA-Update. Carlos weiss es noch nicht.": "The best ideas are born here. For example: Rocket takes over the OTA update. Carlos doesn't know yet.", "Blick auf den Turia-Park. Und auf 14 Kräne. Valencia baut.": "View of the Turia park. And of 14 cranes. Valencia is building.", "Ich hab Salva das Rauchen abgewöhnt. Er vapt jetzt. Fortschritt.": "I got Salva to quit smoking. He vapes now. Progress.", "Balkon, Blick auf den Turia-Park. Eine Zigarette später ist die Welt ruhiger.": "Balcony, view of the Turia park. One cigarette later the world is calmer.", "Der Balkon. Dominiques Revier – Aschenbecher, Blick auf den Park. Ohne Zigaretten: frische Luft.": "The balcony. Dominique's territory – ashtray, view of the park. Without cigarettes: fresh air.", "Office-WC. Jemand hat ein Post-it an den Spiegel geklebt: „Definition of Done?“": "Office toilet. Someone stuck a Post-it on the mirror: \"Definition of Done?\"", "Der CANopen-Prüfstand: ein Bike-Controller am Kabel, ein Oszilloskop, ein Laptop mit Frans Index-Tabelle.": "The CANopen test bench: a bike controller on a cable, an oscilloscope, a laptop with Fran's index table.", "Fran ist nicht da. Ohne ihn fasst man den Prüfstand besser nicht an – letztes Mal hat Guillem den Motor rückwärts laufen lassen.": "Fran isn't here. Better not touch the test bench without him – last time Guillem made the motor run backwards.", "Bike 1 (rot, Werkstatt-Firmware 2.4)": "Bike 1 (red, workshop firmware 2.4)", "Bike 2 (blau, OTA-Kandidat)": "Bike 2 (blue, OTA candidate)", "Diagnose-PC, per CAN-Kabel am {0} angeschlossen. Auf dem Bildschirm laufen die CANopen-Objekte durch.": "Diagnostic PC, connected to {0} via CAN cable. The CANopen objects scroll across the screen.", "Telemetrie lesen": "Read telemetry", "Firmware flashen (OTA)": "Flash firmware (OTA)", "Fehlerspeicher löschen": "Clear error memory", "Lassen": "Leave it", "0x6060 SOC {0} % · 0x6061 Spannung {1} V · 0x6064 Motortemperatur {2} °C · 0x1001 Error-Register 0x00. Alles grün.": "0x6060 SOC {0} % · 0x6061 voltage {1} V · 0x6064 motor temperature {2} °C · 0x1001 error register 0x00. All green.", "Index 0x6060, Subindex 0. Merk dir das – kommt im Quiz.": "Index 0x6060, subindex 0. Remember that – it's in the quiz.", "Der Ladezustand kommt alle 100 Millisekunden per PDO. Wer das pollt, hat CANopen nicht verstanden.": "The state of charge arrives every 100 milliseconds via PDO. Anyone who polls that hasn't understood CANopen.", "Blocktransfer … 41 % … Verbindung weg. Das Bike blinkt rot. Bootloader-Modus. Fran wird das morgen reparieren – mit einem Blick, den du nicht vergessen wirst.": "Block transfer … 41 % … connection lost. The bike blinks red. Bootloader mode. Fran will fix it tomorrow – with a look you won't forget.", "SDO-Blocktransfer, 180 Sekunden, Neustart. Firmware 2.5 läuft. Glück gehabt – Fran hätte dich das nie allein machen lassen.": "SDO block transfer, 180 seconds, reboot. Firmware 2.5 is running. Lucky – Fran would never have let you do that alone.", "OTA über CANopen: SDO-Blocktransfer, 1 Kilobyte pro Block, Checksumme am Ende. Schau zu.": "OTA over CANopen: SDO block transfer, 1 kilobyte per block, checksum at the end. Watch.", "Drei Minuten Fortschrittsbalken. Fran redet derweil über Index-Tabellen. Neustart – Firmware 2.5 läuft. Das ist der Prototyp für die OTA-Story von Rocket.": "Three minutes of progress bar. Meanwhile Fran talks about index tables. Reboot – firmware 2.5 is running. That's the prototype for Rocket's OTA story.", "Fehlerspeicher: 3 Einträge (Unterspannung, CAN-Timeout, Drehmomentsensor). Gelöscht.": "Error memory: 3 entries (undervoltage, CAN timeout, torque sensor). Cleared.", "Gelöscht?! Die wollte ich zuerst lesen. Der CAN-Timeout war mein Beweis gegen den Lieferanten.": "Cleared?! I wanted to read those first. The CAN timeout was my evidence against the supplier.", "Fran wäre nicht begeistert – er liest Fehlerspeicher wie andere Leute Zeitungen.": "Fran wouldn't be pleased – he reads error memories the way other people read newspapers.", "Die Test-E-Bikes von Colba. Akku voll, Display an.": "Colba's test e-bikes. Battery full, display on.", "E-Bike ausleihen (Stadt)": "Borrow an e-bike (city)", "Du ziehst das CAN-Kabel ab und schiebst ein Test-Bike durch die Lounge zum Lift. Unten geht die Fahrt los – im Office ist Fahren verboten (Isabel).": "You unplug the CAN cable and push a test bike through the lounge to the lift. The ride starts downstairs – riding in the office is forbidden (Isabel).", "Du sitzt schon auf einem E-Bike.": "You're already on an e-bike.", "Colba-E-Bikes. Ohne Badge läuft hier nichts – erst oben vorstellen.": "Colba e-bikes. Nothing works here without a badge – introduce yourself upstairs first.", "Bici Rent": "Bici Rent", "Die Colba-Test-Bikes. Fran hat sie frisch geladen.": "The Colba test bikes. Fran has freshly charged them.", "E-Bike-Miete: {0} € für den Tag, Akku voll, Helm inklusive.": "E-bike hire: {0} € for the day, battery full, helmet included.", "E-Bike nehmen": "Take an e-bike", "Nein danke": "No thanks", "Ohne Geld kein Bike.": "No money, no bike.", "Aufgesessen! Mit dem E-Bike bist du doppelt so schnell – bis der Akku leer ist. Radweg im Turia-Park, Promenade am Strand. Mit A absteigen.": "Mounted! On the e-bike you're twice as fast – until the battery is empty. Bike lane in the Turia park, promenade on the beach. Press A to get off.", "Abgestiegen. Akku: {0} %. Das Bike steht jetzt hier – gut, dass Colba genug davon hat.": "Dismounted. Battery: {0} %. The bike stays here now – good thing Colba has plenty of them.", "Erst der Kickoff um 9:30 im Aufenthaltsraum.": "The kickoff at 9:30 in the lounge comes first.", "{0}. Niemand da.": "{0}. Nobody there.", "{0}: {1} am Tisch.": "{0}: {1} at the table.", "Abhängigkeit verhandeln": "Negotiate a dependency", "Kurz plaudern": "Have a quick chat", "Weiter": "Continue", "Planning Poker: Features schätzen": "Planning poker: estimate features", "CANopen-Index-Quiz mit Fran": "CANopen index quiz with Fran", "Fran kommt vorbei · +8 %": "Fran drops by · +8 %", "Mit dem Team reden": "Talk to the team", "{0}. {1} Plan: {2} %.": "{0}. {1} Plan: {2} %.", " sitzen am Tisch.": " are sitting at the table.", "Das Team ist gerade nicht da – die Laptops laufen trotzdem.": "The team isn't here right now – the laptops are running anyway.", "Niemand da zum Reden. Mittagspause? Balkon?": "Nobody to talk to. Lunch break? Balcony?", "Planning Poker für heute erledigt. Morgen gibt es neue Features.": "Planning poker done for today. New features tomorrow.", "{0} von {1} Features im Konsens geschätzt. Plan +{2} %. {3}": "{0} of {1} features estimated by consensus. Plan +{2} %. {3}", "Das Team nickt zufrieden.": "The team nods contentedly.", "Die Ausreisser diskutiert ihr morgen weiter.": "You'll keep discussing the outliers tomorrow.", "Erst der Kickoff.": "The kickoff first.", "Heute schon gefragt. Morgen neue Indexe – ich kenne noch 2000 mehr.": "Already asked today. New indexes tomorrow – I know 2000 more.", "Objektverzeichnis, Objektverzeichnis. Jedes Bike-Signal hat einen Index. Ich frag, du antwortest. Bereit?": "Object dictionary, object dictionary. Every bike signal has an index. I ask, you answer. Ready?", "Alle richtig. Hier, mein Spickzettel. Verlier ihn nicht – er ist handgeschrieben.": "All correct. Here, my cheat sheet. Don't lose it – it's handwritten.", "{0} von {1}. {2} Plan +{3} %.": "{0} of {1}. {2} Plan +{3} %.", "¡Perfecto!": "¡Perfecto!", "Nicht schlecht für einen PO.": "Not bad for a PO.", "Du brauchst mehr Zeit am Prüfstand.": "You need more time at the test bench.", "Das Risiko-Flipchart von {0}. {1}": "{0}'s risk flipchart. {1}", "„Risiko: Carlos refactort alles.“ – Owned.": "\"Risk: Carlos refactors everything.\" – Owned.", "„Risiko: Akku-Lieferant.“ – Mitigated.": "\"Risk: battery supplier.\" – Mitigated.", "„Risiko: Fallas-Woche.“ – Accepted.": "\"Risk: Fallas week.\" – Accepted.", "Die Risiken sind heute geroamt. Morgen tauchen neue auf – das ist ihre Natur.": "The risks have been ROAMed today. New ones will appear tomorrow – that's their nature.", "ROAM: {0} von {1} Risiken sinnvoll eingeordnet (Resolved, Owned, Accepted, Mitigated). Plan +{2} %.": "ROAM: {0} of {1} risks sensibly classified (Resolved, Owned, Accepted, Mitigated). Plan +{2} %.", "Das Programm-Board von {0}: {1} % geplant. Post-its in Teamfarbe, rote Fäden zu den anderen Teams.": "{0}'s program board: {1} % planned. Post-its in team colour, red threads to the other teams.", "Erst der Kickoff um 9:30.": "The kickoff at 9:30 first.", "Das Board ist für heute gefüllt. Post-its halten – meistens.": "The board is filled for today. Post-its stick – mostly.", "{0} Plan +{1} %.": "{0} Plan +{1} %.", "Alle sechs Sprints gefüllt, keiner überlastet.": "All six sprints filled, none overloaded.", "{0} Sprints sauber, der Rest überlastet oder leer.": "{0} sprints clean, the rest overloaded or empty.", "Dependency-Board {0}: ": "Dependency board {0}: ", "geklärt ✓": "sorted ✓", "offen – mit ": "open – negotiate with ", " verhandeln": "", "Keine offenen Abhängigkeiten mit {0}.": "No open dependencies with {0}.", "{0} ist nicht da ({1}). Ohne Lead keine Verhandlung.": "{0} isn't here ({1}). No lead, no negotiation.", "{0}? {1} Wann brauchst du es – beziehungsweise wann liefert ihr?": "{0}? {1} When do you need it – or rather, when will you deliver?", "Deal. Ich schreib es auf das Board – roter Faden.": "Deal. I'll put it on the board – red thread.", "Passt in unseren Sprint. Abgemacht.": "Fits in our sprint. Agreed.", "Okay, aber wenn Carlos refactort, verschiebt sich alles um einen Sprint. Nur dass du es weisst.": "Okay, but if Carlos refactors, everything shifts by one sprint. Just so you know.", "So geht das nicht – der Sprint ist zu früh oder zu spät. Schau dir unsere Kapazität an und komm nochmal.": "That won't work – the sprint is too early or too late. Look at our capacity and come back.", "Ausfahrt! {0} fährt durch den Turia-Park bis zum Strand. Akku-Management ist Teil des Tests: Wer mit leerem Akku ankommt, trägt das Bike die Treppe hoch.": "Ride! {0} rides through the Turia park to the beach. Battery management is part of the test: whoever arrives with an empty battery carries the bike up the stairs.", "Zurück ins Office …": "Back to the office …", "{0} Und: Nach dem Fahren plant es sich leichter. Das ist wissenschaftlich bewiesen. Von mir.": "{0} And: planning is easier after riding. That's scientifically proven. By me.", "Akku {0} % – sauber gefahren!": "Battery {0} % – well ridden!", "Akku leer. Das Bike trägst du jetzt hoch.": "Battery empty. You're carrying the bike up now.", "Die Final-Präsentation ist am Freitag um 15:00.": "The final presentation is on Friday at 15:00.", "Freitag 15:00": "Friday 15:00", "Final & Confidence Vote": "Final & Confidence Vote", "Drei Teams, drei Pläne. {0}. Jetzt stellt jedes Team seine Ziele vor – und dann stimmen wir ab, wie sicher wir uns sind: fünf Finger für „läuft“, ein Finger für „vergiss es“.": "Three teams, three plans. {0}. Now each team presents its objectives – and then we vote on how confident we are: five fingers for \"it'll work\", one finger for \"forget it\".", "Features geschätzt, Risiken geroamt, Abhängigkeiten sauber. Wir committen.": "Features estimated, risks ROAMed, dependencies clean. We commit.", "Der Plan steht zur Hälfte. Wir committen auf die ersten drei Sprints, der Rest ist Forecast.": "The plan is half done. We commit to the first three sprints, the rest is forecast.", "Ehrlich gesagt: Wir haben zu wenig geplant. Viel Poker, wenig Board.": "Honestly: we haven't planned enough. Lots of poker, little board.", "Durchschnitt über vier! Ich habe keine Ahnung, ob das normal ist, aber Simon sagt, das ist sehr gut. Bar Pepita, ich zahle.": "Average above four! I have no idea whether that's normal, but Simon says it's very good. Bar Pepita, I'm paying.", "Drei Komma irgendwas. Solide. Ich habe gelernt, was ein Sprint ist, und ihr habt einen Plan. Prost.": "Three point something. Solid. I've learned what a sprint is and you have a plan. Cheers.", "Hm. Unter drei. Wir reden am Montag nochmal. Trotzdem: danke, Valencia.": "Hm. Below three. We'll talk again on Monday. Still: thank you, Valencia.", "Und jetzt alle raus: Das Office schliesst, der Samstag ist frei. Heimflug um 10:00 – das Taxi steht um 8:15 vor dem Hotel.": "And now everybody out: the office is closing, Saturday is free. Flight home at 10:00 – the taxi is in front of the hotel at 8:15.", "Garten, Grill, Pool, Bass": "Garden, grill, pool, bass", "¡Bienvenidos a mi casa! Das ist der Garten, das ist der Pool, das ist der Grill. Alles andere ist unwichtig. Chorizo ist fast fertig, Pollo braucht noch zwanzig Minuten. Bea hat Ropa Vieja mitgebracht.": "¡Bienvenidos a mi casa! This is the garden, this is the pool, this is the grill. Everything else is unimportant. Chorizo is almost ready, pollo needs another twenty minutes. Bea brought ropa vieja.", "Zwei Stunden geschmort. Wer es nicht probiert, bekommt morgen keine Code-Reviews.": "Braised for two hours. Anyone who doesn't try it gets no code reviews tomorrow.", "Und nach dem Essen: ein Solo. Danny hat die Nachbarn gewarnt. Die Nachbarn haben Ohrstöpsel gekauft.": "And after dinner: a solo. Danny warned the neighbours. The neighbours bought earplugs.", "Im Garten: Grill (A drücken zum Grillen), Gartentisch mit Mojitos und Ropa Vieja, Carlos’ Verstärker, Pool und Hängematte. Das Gartentor unten bringt dich per Taxi zurück in die Stadt.": "In the garden: grill (press A to barbecue), garden table with mojitos and ropa vieja, Carlos' amp, pool and hammock. The garden gate at the bottom takes you back to town by taxi.", "Drinnen ist nur die Küche – und Beas Topf. Der Garten ist die Party.": "Inside there's only the kitchen – and Bea's pot. The garden is the party.", "Das Haus habe ich 2019 gekauft. Mit Garten, weil ich in Havanna auf einem Balkon im dritten Stock gegrillt habe. Die Nachbarn fanden das weniger lustig als ich.": "I bought the house in 2019. With a garden, because in Havana I used to barbecue on a third-floor balcony. The neighbours found that less funny than I did.", "Grillzange? Chorizo, Pollo oder Maiskolben – aber nicht verbrennen lassen. Der Grill ist heiss wie Havanna im August.": "Tongs? Chorizo, pollo or corn on the cob – but don't let it burn. The grill is as hot as Havana in August.", "Der Grill ist aus. Danny grillt nur, wenn Gäste da sind.": "The grill is off. Danny only barbecues when there are guests.", "Chorizo wenden & essen": "Turn & eat chorizo", "Pollo asado": "Pollo asado", "Nur zuschauen": "Just watch", "Okay": "Okay", "¡Ay, no! Verbrannt. Das war mein letzter Chorizo. Nein, Spass – hier, der nächste.": "¡Ay, no! Burnt. That was my last chorizo. No, kidding – here, the next one.", "{0}. Rauch, Holzkohle, ein Hauch Limette – Danny marinert mit Mojo.": "{0}. Smoke, charcoal, a hint of lime – Danny marinates with mojo.", "Vom Grill direkt auf den Teller. Vicente fotografiert sein Essen, Estella isst seines.": "From the grill straight onto the plate. Vicente photographs his food, Estella eats hers.", "Danny wendet mit der einen Hand und erklärt mit der anderen den Backlog.": "Danny turns with one hand and explains the backlog with the other.", "Der Gartentisch: Gläser, Limetten, Hierbabuena. Vorbereitet für den Abend.": "The garden table: glasses, limes, hierbabuena. Prepared for the evening.", "Setz dich. Ropa Vieja, Mojito nach Dannys Rezept – oder beides?": "Sit down. Ropa vieja, mojito after Danny's recipe – or both?", "Ropa Vieja": "Ropa Vieja", "Mojito cubano": "Mojito cubano", "Beides": "Both", "Ropa Vieja heisst „alte Kleider“ – wegen der Fasern. Schmeckt besser, als es heisst.": "Ropa vieja means \"old clothes\" – because of the fibres. Tastes better than it sounds.", "Hierbabuena, nicht Minze! Das ist der Unterschied zwischen Havanna und einer Hotelbar.": "Hierbabuena, not mint! That's the difference between Havana and a hotel bar.", "Havana Club 3 Años. In der Schweiz zahlt ihr dafür 40 Franken. Hier: 12 Euro. Sag es Robin nicht.": "Havana Club 3 Años. In Switzerland you pay 40 francs for it. Here: 12 euros. Don't tell Robin.", "Ein kleiner Verstärker im Garten. Carlos ist noch nicht da – ohne ihn bleibt er stumm.": "A small amp in the garden. Carlos isn't here yet – without him it stays silent.", "Zugabe? Die Nachbarn … okay, eine noch. Kurz.": "Encore? The neighbours … okay, one more. Short.", "Okay. Ein Riff aus dem Proberaum. „Null Pointer“ – unser Opener. Danny, Licht aus, Grill an.": "Okay. A riff from the rehearsal room. \"Null Pointer\" – our opener. Danny, lights off, grill on.", "Zwei Minuten Bass-Solo, Verzerrer auf elf, Dannys Hund flüchtet unter die Hängematte. Robin filmt, Luigi headbangt, Bea lächelt – zum ersten Mal diese Woche sichtbar. Das Fenster vom Nachbarhaus geht auf. Und wieder zu.": "Two minutes of bass solo, distortion on eleven, Danny's dog flees under the hammock. Robin films, Luigi headbangs, Bea smiles – visibly for the first time this week. The neighbour's window opens. And closes again.", "Das war der Refrain. Die Strophe spielen wir am Samstag im Proberaum. Ihr seid eingeladen – aber ihr fliegt ja. Nächstes PI.": "That was the chorus. We'll play the verse on Saturday in the rehearsal room. You're invited – but you're flying. Next PI.", "Füsse im Pool, Mojito in der Hand, der Grill raucht. Planning war gestern.": "Feet in the pool, mojito in hand, the grill is smoking. Planning was yesterday.", "Luigi überlegt laut, ob man ein Kart im Pool fahren könnte. Danny sagt Nein. Luigi sagt: Schade.": "Luigi wonders aloud whether you could drive a kart in the pool. Danny says no. Luigi says: pity.", "Hängematte zwischen zwei Orangenbäumen. Von hier aus klingt sogar Carlos’ Bass wie Schlafmusik.": "Hammock between two orange trees. From here even Carlos' bass sounds like a lullaby.", "Du schaukelst. Robin fragt, ob das Teambuilding ist. Danny: „Das ist Kuba.“": "You swing. Robin asks if this is team building. Danny: \"This is Cuba.\"", "Schon los? Das Taxi kommt in fünf Minuten – ich zahle. Chorizo für den Weg?": "Leaving already? The taxi comes in five minutes – I'm paying. Chorizo for the road?", "Zurück zum Hotel": "Back to the hotel", "In die Bar Pepita": "To Bar Pepita", "Noch bleiben": "Stay a while", "Zurück in die Stadt …": "Back to town …", "Geschlossen. Öffnungszeiten: {0}.": "Closed. Opening hours: {0}.", "Der Turia-Brunnen: der Flussgott und acht Frauen mit Krügen – die acht Bewässerungskanäle.": "The Turia fountain: the river god and eight women with jugs – the eight irrigation channels.", "Münze werfen": "Toss a coin", "Hände kühlen": "Cool your hands", "Foto": "Photo", "Plitsch. Wunsch: ein Plan mit 100 %.": "Plop. Wish: a plan at 100 %.", "Erfrischend. Ein Tourist filmt dich dabei.": "Refreshing. A tourist films you doing it.", "Das Tribunal de las Aguas: acht Männer in schwarzen Kitteln auf Stühlen vor der Puerta de los Apóstoles. Ein Bauer klagt, ein anderer verteidigt sich – auf Valencianisch, mündlich, ohne Akten. Seit über tausend Jahren jeden Donnerstag um zwölf. Das Urteil: 30 Sekunden.": "The Tribunal de las Aguas: eight men in black smocks on chairs in front of the Puerta de los Apóstoles. One farmer complains, another defends himself – in Valencian, orally, without files. Every Thursday at twelve for over a thousand years. The verdict: 30 seconds.", "Die Puerta de los Apóstoles. Jeden Donnerstag um 12 Uhr tagt hier das Wassergericht – das älteste Gericht Europas, UNESCO-Kulturerbe.": "The Puerta de los Apóstoles. Every Thursday at noon the Water Tribunal sits here – the oldest court in Europe, UNESCO heritage.", "Der Bankomat kennt dich schon: „Tageslimite erreicht.“": "The ATM already knows you: \"Daily limit reached.\"", "Bankomat. Deine Firmenkarte.": "ATM. Your company card.", "100 € abheben": "Withdraw 100 €", "200 € abheben": "Withdraw 200 €", "Abbrechen": "Cancel", "Scheine raus. Die Spesenabrechnung macht Isabel.": "Notes out. Isabel does the expense report.", "Estación del Norte, 1917: Orangen aus Keramik, Mosaike, Holzschalter. Der Schalterbeamte: „Zug nach Zürich? Das dauert 17 Stunden. Nehmen Sie das Flugzeug.“": "Estación del Norte, 1917: ceramic oranges, mosaics, wooden counters. The clerk: \"Train to Zurich? That takes 17 hours. Take the plane.\"", "Nico": "Nico", "Kart Valencia: 10 Minuten, 22 €. {0}": "Kart Valencia: 10 minutes, 22 €. {0}", "Luigi steht schon mit Helm da und grinst.": "Luigi is already standing there with his helmet, grinning.", "Freie Bahn.": "Track's free.", "Rennen gegen Luigi": "Race against Luigi", "Zeitfahren": "Time trial", "Zuschauen": "Watch", "Ohne Ticket kein Kart.": "No ticket, no kart.", "Du hast mich geschlagen?! Die Bahn ist kaputt. Das Kart war kaputt. Nochmal! – Nein, okay. Der Pokal ist deiner. Vorerst.": "You beat me?! The track is broken. The kart was broken. Again! – No, okay. The trophy is yours. For now.", "Beste Runde {0} Sekunden – aber meine war schneller. Erfahrung, Linie, Bremspunkt. Ich erklär es dir im Taxi.": "Best lap {0} seconds – but mine was faster. Experience, line, braking point. I'll explain it in the taxi.", "Beste Runde: {0} Sekunden. {1}": "Best lap: {0} seconds. {1}", "¡Muy bien!": "¡Muy bien!", "Die Linie durch die Haarnadel übt man.": "You practise the line through the hairpin.", "Sergio": "Sergio", "Padel-Turnier! Doppel mit mir gegen {0} und einen Einheimischen. Schläger inklusive. 8 €.": "Padel tournament! Doubles with me against {0} and a local. Rackets included. 8 €.", "Spielen": "Play", "Ohne Geld kein Court.": "No money, no court.", "Vale, vale, ihr habt gewonnen. Die Wand ist unfair. Revanche am Strand?": "Vale, vale, you won. The wall is unfair. Rematch on the beach?", "{0}:{1}. Beim Padel geht alles über die Wand – das lernt man.": "{0}:{1}. In padel everything goes via the wall – you learn that.", "Ab 23 Uhr. Vorher: Jamón, Bodega, Spaziergang.": "From 11 pm. Before that: jamón, bodega, a walk.", "Nein. Heute nicht. Geh ins Hotel, trink Wasser.": "No. Not today. Go to the hotel, drink water.", "Pasa, pasa. Keine Fotos vom DJ.": "Pasa, pasa. No photos of the DJ.", "Jordi": "Jordi", "Gelbe Flagge heute. Baden ja, Surfen eher nicht.": "Yellow flag today. Swimming yes, surfing rather not.", "Sonnencreme! Ich sehe das Schweizer Rot schon von hier.": "Sunscreen! I can see the Swiss red from here.", "Die Möwen klauen Bocadillos. Ich warne nur.": "The seagulls steal bocadillos. Just warning you.", "Strandfussball! {0} steht im Tor. Fünf Schüsse, fünf gehalten – wer gewinnt?": "Beach football! {0} is in goal. Five shots, five saves – who wins?", "Elfmeterschiessen": "Penalty shoot-out", "{0}:{1}. Du hast gewonnen – der Sand hat mich gebremst. Sagt jeder Torwart.": "{0}:{1}. You won – s on the lounger. Seagulls, waves, a vendor with mojitos in a bucket.", "Du döst weg. Das Planning ist weit weg. Bis dein Handy vibriert: Isabel fragt nach der Paella-Bestellung.": "You doze off. The planning is far away. Until your phone buzzes: Isabel is asking about the paella order.", "Segeltörn im Hafen: Du am Ruder, ich am Grosssegel. Durch die Bojen, gegen den Wind, zurück zur Marina. 35 €.": "Sailing trip in the harbour: you at the helm, me on the mainsail. Through the buoys, against the wind, back to the marina. 35 €.", "Segel setzen": "Set sail", "Nur schauen": "Just look", "Ohne Geld kein Boot.": "No money, no boat.", "Leinen los …": "Cast off …", "Alle {0} Bojen gerundet! Du hast das Gefühl für den Wind. America’s Cup, nächstes Jahr.": "All {0} buoys rounded! You've got a feel for the wind. America's Cup, next year.", "{0} von {1} Bojen. Der Wind dreht, das Boot auch. Nochmal?": "{0} of {1} buoys. The wind turns, so does the boat. Again?", "Inés": "Inés", "Degustation: vier Weine aus Utiel-Requena und Alicante, blind. Du sagst, welche Traube. 15 €.": "Tasting: four wines from Utiel-Requena and Alicante, blind. You say which grape. 15 €.", "Degustieren": "Taste", "Nur ein Glas Bobal": "Just a glass of Bobal", "Ohne Geld kein Wein.": "No money, no wine.", "Alle vier! Bobal, Monastrell, Tempranillo, Garnacha. Du hast eine Nase. Oder Glück. Salud.": "All four! Bobal, Monastrell, Tempranillo, Garnacha. You have a nose. Or luck. Salud.", "{0} von {1}. Der Bobal ist der mit der Kirsche. Merk dir das – er ist der Wein von Valencia.": "{0} of {1}. The Bobal is the one with the cherry. Remember that – it's the wine of Valencia.", "Ramón": "Ramón", "Bellota heisst: Das Schwein hat Eicheln gefressen. 36 Monate gereift. Hauchdünn geschnitten, sonst ist es Verschwendung.": "Bellota means: the pig ate acorns. Cured for 36 months. Sliced paper-thin, otherwise it's a waste.", "Die Schweizer essen Jamón mit Brot. Die Valencianer mit den Fingern. Beides erlaubt.": "The Swiss eat jamón with bread. The Valencians with their fingers. Both allowed.", "Ein Jamón, zwanzig Kilo, zwei Wochen. Wenn man es richtig macht.": "One jamón, twenty kilos, two weeks. If you do it right.", "Reggaeton, Techno, ein bisschen Rumba. Was willst du?": "Reggaeton, techno, a bit of rumba. What do you want?", "Tanzfläche voll, Bass voll. Lass dich sehen!": "Dance floor full, bass full. Show yourself!", "Luigi hat sich „Formula 1 Theme“ gewünscht. Nein.": "Luigi requested the \"Formula 1 Theme\". No.", "{0} %! Die Tanzfläche gehört dir.": "{0} %! The dance floor is yours.", "{0} % der Beats getroffen. {1}": "{0} % of the beats hit. {1}", "Die Hüfte lockert sich.": "The hips are loosening up.", "Agua de Valencia hilft nicht beim Rhythmus.": "Agua de Valencia doesn't help with rhythm.", "Lounge-Sofa. Der Bass massiert den Rücken.": "Lounge sofa. The bass massages your back.", "Señor Ferrer": "Señor Ferrer", "Kein Blitz, bitte. Und nicht so nah an den Velázquez.": "No flash, please. And not so close to the Velázquez.", "Das Museum ist das zweitgrösste Spaniens, nach dem Prado. Sagen wir hier gern.": "The museum is the second largest in Spain, after the Prado. We like to say that here.", "Sorolla hat am Strand gemalt, wo heute die Chiringuitos stehen.": "Sorolla painted on the beach where the chiringuitos stand today.", "Toni": "Toni", "¡Dorada, lubina, sepia! Alles heute Morgen aus dem Golf.": "¡Dorada, lubina, sepia! All from the Gulf this morning.", "Du willst Fisch ins Hotel mitnehmen? Marta wird nicht begeistert sein.": "You want to take fish to the hotel? Marta won't be thrilled.", "Kauf eine Dorada für Isabel. Sie liebt Fisch. Sagt jedenfalls Vicente.": "Buy a dorada for Isabel. She loves fish. At least Vicente says so.", "Hol erst deinen Koffer – Band 3.": "Get your suitcase first – belt 3.", "Bis später": "See you later", "Ah, da bist du! Ich stehe seit zwanzig Minuten hier und mein Koffer kommt nicht. – Das ist Band 4, Leipzig? Oh. Das erklärt den Mann mit dem Sachsen-Trikot.": "Ah, there you are! I've been standing here for twenty minutes and my suitcase isn't coming. – This is belt 4, Leipzig? Oh. That explains the man in the Saxony jersey.", "Schau dir das an: Cupra Formentor, 310 PS, für 89 Euro am Tag. Wir könnten … – Nein? Taxi? Okay. Aber Mittwoch Kartbahn.": "Look at that: Cupra Formentor, 310 hp, for 89 euros a day. We could … – No? Taxi? Okay. But Wednesday kart track.", "Man darf hier drin nicht rauchen. Ich hab’s versucht. Der Sicherheitsmann war sehr freundlich und sehr bestimmt. Gehen wir?": "You can't smoke in here. I tried. The security guard was very friendly and very firm. Shall we go?", "Mein Koffer ist noch nicht da, aber ich hab den Batteriepass-Entwurf dabei. 40 Seiten. Willst du … später. Verstehe.": "My suitcase isn't here yet, but I've got the battery pass draft with me. 40 pages. Do you want to … later. Understood.", "Da bist du. Taxi ist bestellt, Hotel bestätigt, Bar für 19 Uhr reserviert. Robin steht am falschen Band – ich geh ihn holen. Nein, du gehst.": "There you are. Taxi ordered, hotel confirmed, bar reserved for 7 pm. Robin is at the wrong belt – I'll get him. No, you go.", "Lukas gibt dir den Battery-Pass-Flyer (Tasche).": "Lukas gives you the battery pass flyer (bag).", "Alle beisammen! Der Ausgang ist unten – dort stehen die Taxis.": "Everyone together! The exit is at the bottom – that's where the taxis are.", "Hola!": "Hola!", "Wie steht der Plan?": "How's the plan going?", "Da fehlt noch viel – Poker, Board, Risiken.": "Still a lot missing – poker, board, risks.", "Auf gutem Weg. Die Abhängigkeiten nicht vergessen.": "On a good track. Don't forget the dependencies.", "Commitment-reif. Freitag wird gut.": "Ready to commit. Friday will be fine.", "Alles im Plan?": "Everything on plan?", "Hast du die Agenda gesehen?": "Have you seen the agenda?", "Reservierung für Donnerstag steht.": "Thursday's reservation is sorted.", "Was steht heute an?": "What's on today?", "Organisation": "Organisation", "Taxi Samstag 8:15, Flug 10:00. Ich hab es dreimal bestätigt.": "Taxi Saturday 8:15, flight 10:00. I've confirmed it three times.", "Isabel und ich haben den Mittagsplan: Di Paella, Mi Burger, Do Bocadillos, Fr Healthy.": "Isabel and I have the lunch plan: Tue paella, Wed burger, Thu bocadillos, Fri healthy.", "Jeder hat seinen Raum. Jeder hat Post-its. Was kann schiefgehen.": "Everyone has their room. Everyone has Post-its. What could go wrong.", "Hast du die Autos hier gesehen?": "Have you seen the cars here?", "Mittwoch: Kartbahn.": "Wednesday: kart track.", "Ein Seat León mit 300 PS …": "A Seat León with 300 hp …", "Über Autos reden": "Talk about cars", "Der Taxifahrer hatte einen Toledo. Ein Toledo! Die gibt es seit 2019 nicht mehr.": "The taxi driver had a Toledo. A Toledo! They stopped making those in 2019.", "Cupra, das ist Seat mit Attitüde. Und Kupferfarbe.": "Cupra, that's Seat with attitude. And copper paint.", "Wenn ich reich bin: Alpine A110. Leicht, französisch, laut.": "When I'm rich: Alpine A110. Light, French, loud.", "E-Bikes sind auch Autos. Nur ohne Dach. Und ohne Motor. Also, mit kleinem Motor.": "E-bikes are cars too. Just without a roof. And without an engine. Well, with a small motor.", "Kartbahn?": "Kart track?", "Heute Abend ab 18 Uhr bin ich dort. Südwesten der Stadt. Bring Mut mit.": "Tonight from 6 pm I'm there. South-west of the city. Bring courage.", "Mittwochabend. Ich bin dort. Du wirst verlieren.": "Wednesday evening. I'll be there. You'll lose.", "Kommst du mit auf den Balkon?": "Coming to the balcony?", "Hast du Feuer?": "Got a light?", "Rocket ist bereit.": "Rocket is ready.", "Rauchpause?": "Smoke break?", "Balkon, oben rechts im Aufenthaltsraum. Ich geh vor.": "Balcony, top right in the lounge. I'll go ahead.", "Hier? Gern. Aber nur, wenn du eine hast.": "Here? Sure. But only if you've got one.", "Carlos refactort, Salva lernt, Aitor löst. Und Lukas erklärt den Batteriepass. Beste Mischung.": "Carlos refactors, Salva learns, Aitor solves. And Lukas explains the battery pass. Best mix.", "Rocket macht das Händlerportal und die Battery-Pass-API. Und OTA, wenn Indurain liefert.": "Rocket does the dealer portal and the battery pass API. And OTA, if Indurain delivers.", "Sag mal, wo ist nochmal der Aufenthaltsraum?": "Tell me, where's the lounge again?", "Ist das normal, dass alle Post-its kleben?": "Is it normal that all the Post-its stick?", "Mein erstes PI Planning. Aufregend.": "My first PI planning. Exciting.", "Den Weg zeigen": "Show the way", "Danke. Ich hatte den Lift rechts genommen – der hält im Zwischengeschoss.": "Thanks. I'd taken the right lift – it stops on the mezzanine.", "Ah, der Aufenthaltsraum ist rechts. Ich war im WC. Zweimal.": "Ah, the lounge is on the right. I was in the toilet. Twice.", "Ihr seid alle so geduldig mit mir.": "You're all so patient with me.", "Meine Folien kamen an, oder? Fran hat gelacht. Ich glaube, es war ein gutes Lachen.": "My slides went down well, didn't they? Fran laughed. I think it was a good laugh.", "24 Folien. Ich übe noch. Was heisst nochmal „Commitment“ auf Spanisch?": "24 slides. Still practising. What's \"commitment\" in Spanish again?", "Wusstest du, dass jede Batterie ab 2027 einen Pass braucht?": "Did you know every battery needs a passport from 2027?", "Der Entwurf hat 40 Seiten.": "The draft is 40 pages.", "Grüezi.": "Grüezi.", "Battery Pass erklären lassen": "Have the battery pass explained", "EU-Batterieverordnung: Jede E-Bike-Batterie bekommt einen digitalen Pass. QR-Code drauf, Daten dahinter: Herkunft, Kapazität, CO₂-Fussabdruck, Zustand. Rocket baut die API, Meeseeks zeigt es in der App. Und die Zelle meldet ihren State of Health über CANopen – Index 0x6080, falls Fran fragt.": "EU battery regulation: every e-bike battery gets a digital passport. QR code on it, data behind it: origin, capacity, CO₂ footprint, condition. Rocket builds the API, Meeseeks shows it in the app. And the cell reports its state of health over CANopen – index 0x6080, in case Fran asks.", "Schweiz vs. Spanien": "Switzerland vs. Spain", "Hier isst man um 14 Uhr Mittag. Mein Magen ist auf Berner Zeit.": "People eat lunch at 2 pm here. My stomach is on Bern time.", "Die Mascletà ist lauter als das Zibelemärit-Feuerwerk. Viel lauter.": "The Mascletà is louder than the Zibelemärit fireworks. Much louder.", "Ich hab Rivella im Koffer. Nur für Notfälle.": "I've got Rivella in my suitcase. Emergencies only.", "Nu, alles klar?": "Nu, all good?", "SwiftUI ist die Zukunft.": "SwiftUI is the future.", "Club Mate?": "Club Mate?", "Wie war die Anreise?": "How was the journey?", "Leipzig – Frankfurt – Valencia. In Frankfurt drei Stunden Verspätung, aber ich hab dabei das Onboarding-Flow neu gebaut. Guillem wird es lieben. Oder hassen. Beides okay.": "Leipzig – Frankfurt – Valencia. Three hours late in Frankfurt, but I rebuilt the onboarding flow while waiting. Guillem will love it. Or hate it. Both fine.", "iOS bei Meeseeks": "iOS at Meeseeks", "Pablo und Guillem machen die UI, ich die CAN-Bridge. Alles in Swift, alles typsicher.": "Pablo and Guillem do the UI, I do the CAN bridge. All in Swift, all type-safe.", "Oscar ist der ruhigste Mensch, den ich kenne. Sein Code auch.": "Oscar is the calmest person I know. So is his code.", "Wind kommt auf.": "Wind's picking up.", "Morgen früh am Strand?": "Beach tomorrow morning?", "Aloha – falsch, hola.": "Aloha – wrong, hola.", "Fuerteventura?": "Fuerteventura?", "Fuerte: Wind, Wellen, Wüste. Ich arbeite vom Van aus, Starlink auf dem Dach. Die Roadmap entsteht zwischen zwei Sessions. Hier in Valencia ist die Welle klein, aber das Licht ist besser.": "Fuerte: wind, waves, desert. I work from the van, Starlink on the roof. The roadmap takes shape between two sessions. Here in Valencia the wave is small, but the light is better.", "Roadmap": "Roadmap", "Die Roadmap ist ein Surfbrett: Richtung klar, Weg flexibel.": "The roadmap is a surfboard: direction clear, path flexible.", "Drei Themen fürs halbe Jahr: Batteriepass, Diagnose, Händlerportal. Alles andere ist Schaum.": "Three themes for the half year: battery pass, diagnostics, dealer portal. Everything else is foam.", "¡Oye, asere! Indurain fährt vorne.": "¡Oye, asere! Indurain leads the way.", "Hola, jefe.": "Hola, jefe.", "Wir brauchen den Parser von Carlos.": "We need Carlos' parser.", "Mittwochabend: Asado bei mir im Garten. Keine Ausreden.": "Wednesday evening: asado in my garden. No excuses.", "Fran kennt die Hardware, Bea das Backend, Vicente die Pipeline, Estella alles andere. Ich halte die Fäden.": "Fran knows the hardware, Bea the backend, Vicente the pipeline, Estella everything else. I hold the threads.", "Wir heissen Indurain, weil wir im Tempo bleiben. Fünf Tour-Siege, kein Sprinter.": "We're called Indurain because we keep the pace. Five Tour wins, no sprinter.", "Kuba": "Cuba", "Havanna, Vedado. Mit 24 nach Valencia – das Licht ist dasselbe, nur der Kaffee ist schlechter. Bea kommt aus Santiago, wir haben uns hier im Büro kennengelernt und auf Spanisch mit kubanischem Akzent gestritten.": "Havana, Vedado. To Valencia at 24 – the light is the same, only the coffee is worse. Bea is from Santiago, we met here in the office and argued in Spanish with Cuban accents.", "In Kuba lernt man, mit dem zu bauen, was da ist. Ein 57er Chevy läuft mit einem Lada-Motor. Genau so refactoren wir den CAN-Parser.": "In Cuba you learn to build with what's there. A '57 Chevy runs with a Lada engine. That's exactly how we refactor the CAN parser.", "Mein Mojito-Rezept: Hierbabuena, nicht Minze. Brauner Zucker, Limette, Havana Club 3 Años, Soda. Mittwoch im Garten zeig ich es euch.": "My mojito recipe: hierbabuena, not mint. Brown sugar, lime, Havana Club 3 Años, soda. I'll show you on Wednesday in the garden.", "Dein Haus": "Your house", "Vorort, zwanzig Minuten mit dem Taxi. Garten, Pool, Hängematte und ein Grill, auf den ich stolzer bin als auf jedes Release. Mittwoch ab 19 Uhr seid ihr alle eingeladen – Taxi nehmen, ich zahle den Rückweg.": "Suburb, twenty minutes by taxi. Garden, pool, hammock and a grill I'm prouder of than any release. Wednesday from 7 pm you're all invited – take a taxi, I'll pay the way back.", "Heute Abend! Taxi vor dem Hotel oder an der Estación: „Zu Danny“. Ich bin ab sieben am Grill.": "Tonight! Taxi in front of the hotel or at the Estación: \"To Danny's\". I'm at the grill from seven.", "Der Grill ist noch warm von gestern. Nächstes Mal bleibt ihr länger.": "The grill is still warm from yesterday. Next time you stay longer.", "0x6060. Frag nicht, sag es einfach.": "0x6060. Don't ask, just say it.", "Der Prüfstand läuft.": "The test bench is running.", "CANopen ist ein Objektverzeichnis mit Gefühlen.": "CANopen is an object dictionary with feelings.", "Über Hardware reden": "Talk about hardware", "Der Motorcontroller spricht CANopen mit 250 kBit/s. Mehr braucht ein Bike nicht.": "The motor controller speaks CANopen at 250 kbit/s. A bike doesn't need more.", "SDO ist Fragen und Antworten. PDO ist Schreien. Das Bike schreit die Geschwindigkeit, alle zehn Millisekunden.": "SDO is questions and answers. PDO is shouting. The bike shouts the speed every ten milliseconds.", "Heartbeat 0x1017. Wenn das Bike nicht mehr schlägt, ist es tot. Oder der Stecker ist raus.": "Heartbeat 0x1017. If the bike stops beating, it's dead. Or the plug is out.", "¡Hola! Ich hab eine Idee!": "¡Hola! I've got an idea!", "Können wir das heute noch einbauen?": "Can we still build that in today?", "Ich bin früh da, ich geh spät.": "I'm here early, I leave late.", "Deine Idee?": "Your idea?", "Ein Dashboard, das den Akku als Orange anzeigt. Je leerer, desto weniger Spalten!": "A dashboard that shows the battery as an orange. The emptier, the fewer segments!", "Wir könnten das Diagnose-Tool in einer Woche bauen. Danny sagt drei. Wir treffen uns bei zwei.": "We could build the diagnostic tool in a week. Danny says three. We'll meet at two.", "Ich hab gestern bis elf den CAN-Logger umgebaut. Fran hat es gemerkt. Er hat nichts gesagt. Das heisst: gut.": "I rebuilt the CAN logger until eleven last night. Fran noticed. He said nothing. That means: good.", "…hola.": "…hola.", "Der Service läuft.": "The service is running.", "Ich hab das Backend gestern migriert. Niemand hat es gemerkt – gut.": "I migrated the backend yesterday. Nobody noticed – good.", "Backend": "Backend", "Telemetrie rein, Events raus. Postgres, Kafka, ein bisschen Rust.": "Telemetry in, events out. Postgres, Kafka, a bit of Rust.", "Ich rede nicht viel. Mein Code auch nicht. Er funktioniert einfach.": "I don't talk much. Neither does my code. It just works.", "Santiago de Cuba. Dort ist es lauter als hier – ich bin die Ruhige, weil zuhause alle reden. Danny ist aus Havanna, das merkt man: Er redet für zwei.": "Santiago de Cuba. It's louder there than here – I'm the quiet one because everyone at home talks. Danny is from Havana, you can tell: he talks for two.", "Programmieren habe ich in Santiago gelernt, mit einem Rechner, den sich zwanzig Leute geteilt haben. Deshalb schreibe ich kleine Funktionen.": "I learned to code in Santiago, on a computer twenty people shared. That's why I write small functions.", "Mittwoch bringe ich Ropa Vieja mit. Rindfleisch, lange geschmort, mit Paprika. Danny grillt, ich koche. Arbeitsteilung wie im Team.": "On Wednesday I'm bringing ropa vieja. Beef, braised for a long time, with peppers. Danny grills, I cook. Division of labour, like in the team.", "Pipeline grün.": "Pipeline green.", "Hast du meine Tortilla gegessen?": "Did you eat my tortilla?", "Deploy ist Freitag. Wie immer. Leider.": "Deploy is Friday. As always. Unfortunately.", "DevOps": "DevOps", "Kubernetes, ArgoCD, Grafana. Und ein Bash-Skript von 2019, das niemand anfasst.": "Kubernetes, ArgoCD, Grafana. And a bash script from 2019 that nobody touches.", "Burger-Mittwoch ist mein Werk. Der Foodtruck gehört meinem Cousin.": "Burger Wednesday is my doing. The encia tanzen geht.": "Pascal shows me SwiftUI tricks. I show him where to go dancing in Valencia.", "Hola. Das Design-System ist fast fertig.": "Hola. The design system is almost done.", "Kannst du das UI anschauen?": "Can you look at the UI?", "Farben, Abstände, Typografie. Der Rest ist Code.": "Colours, spacing, typography. The rest is code.", "Design-System": "Design system", "Komponenten für alle Apps: Buttons, Karten, der Akku-Ring. Indurain nutzt sie für die Werkstatt-App.": "Components for all apps: buttons, cards, the battery ring. Indurain uses them for the workshop app.", "Ich hab die Teamfarben gewählt: Rot für Indurain, Blau für Meeseeks, Orange für Rocket. Post-its passend.": "I chose the team colours: red for Indurain, blue for Meeseeks, orange for Rocket. Matching Post-its.", "Das muss refactort werden.": "That needs refactoring.", "Architektur zuerst.": "Architecture first.", "Wer hat diesen Parser geschrieben? Ah. Ich. 2019.": "Who wrote this parser? Ah. Me. 2019.", "Samstag Konzert. Hardrock. Ich bin am Bass.": "Concert on Saturday. Hard rock. I'm on bass.", "Refactoring": "Refactoring", "Der CAN-Parser hat 4000 Zeilen in einer Datei. Nach dem Refactoring: 40 Dateien mit 100 Zeilen. Besser? Ja. Schneller? Wir werden sehen.": "The CAN parser has 4000 lines in one file. After the refactoring: 40 files of 100 lines. Better? Yes. Faster? We'll see.", "Ein Sprint Refactoring spart drei Sprints Bugs. Das sage ich jedem PO. Dominique hört zu.": "One sprint of refactoring saves three sprints of bugs. I tell every PO. Dominique listens.", "Deine Band": "Your band", "„Stack Overflow“ – vier Entwickler, ein Proberaum in Benimaclet, Hardrock. Ich spiele Bass, weil der Bass die Architektur ist: Man hört ihn nicht, aber ohne ihn fällt alles zusammen.": "\"Stack Overflow\" – four developers, a rehearsal room in Benimaclet, hard rock. I play bass because the bass is the architecture: you don't hear it, but without it everything collapses.", "Ein Riff ist auch nur
