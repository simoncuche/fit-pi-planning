Cervezas</small><b>{11}</b></div>\n      <div class=\"stat\"><small>Cafés</small><b>{12}</b></div><div class=\"stat\"><small>Dinero restante</small><b>{13}</b></div></div>\n      <p class=\"note\">Indurain {14} % · Meeseeks {15} % · Rocket {16} %</p>\n      </div><div class=\"panel-foot\"><span>Puntos totales: {17}</span><button class=\"btn primary\" id=\"endNew\">Nueva partida</button></div></div>", "Wer spielt mit?": "¿Quién juega?", "Vorschlag: {0}. Tipp auf einen anderen Namen oder gestalte dein Aussehen – dann Boarding!": "Propuesta: {0}. Toca otro nombre o diseña tu aspecto – ¡y a embarcar!", "Reisegruppe": "Grupo de viaje", "{0}. Jetzt Aussehen gestalten – oder direkt einsteigen.": "{0}. Diseña tu aspecto ahora – o embarca directamente.", "Alle anderen spielen als Kolleginnen und Kollegen mit. Wer einen PO spielt, plant mit dessen Team; alle anderen helfen ihrem Team. Die Reisegruppe landet am Flughafen, die Colba-Leute holen sie dort ab.": "Los demás participan como compañeros. Quien juega con un PO planifica con su equipo; los demás ayudan a su propio equipo. El grupo de viaje aterriza en el aeropuerto, la gente de Colba los recoge allí.", "Organisator · PO Indurain": "Organizador · PO Indurain", "PO Meeseeks · Autofan": "PO Meeseeks · fan de los coches", "PO Rocket": "PO Rocket", "Geschäftsführer · zum ersten Mal dabei": "Director general · su primera vez", "Battery-Pass-Spezialist": "Especialista en pasaporte de baterías", "iOS-Entwickler aus Leipzig": "Desarrollador iOS de Leipzig", "Product Manager aus Fuerteventura · Surfer": "Product manager de Fuerteventura · surfero", "Teamleiter Indurain": "Jefe del equipo Indurain", "Hardware-Entwickler · CANopen-Experte": "Desarrollador de hardware · experto en CANopen", "Software-Entwicklerin · Indurain": "Desarrolladora de software · Indurain", "Backend-Entwicklerin": "Desarrolladora backend", "DevOps-Engineer": "Ingeniero DevOps", "Inhaber von Colba · Android": "Dueño de Colba · Android", "Android-Entwickler": "Desarrollador Android", "UX- und UI-Designerin": "Diseñadora UX y UI", "Software-Architekt · Bassist": "Arquitecto de software · bajista", "Software-Entwickler · Rocket": "Desarrollador de software · Rocket", "Software-Entwickler · Radfahrer": "Desarrollador de software · ciclista", "Backoffice · Organisation": "Backoffice · organización", "Gepäckband 3: Die Schweizer landen – hol sie dort ab": "Cinta 3: los suizos aterrizan – recógelos allí", "Du bist {0}, {1}. Juanjo hat dich zum Flughafen geschickt: Die Schweizer landen um 12 Uhr, Band 3. Hol sie ab und bring sie ins Hotel Kramer – Juanjo hat für die PI-Woche auch für euch Valencianer Zimmer gebucht, damit nach dem Agua de Valencia niemand Mofa fahren muss.": "Eres {0}, {1}. Juanjo te ha mandado al aeropuerto: los suizos aterrizan a las 12, cinta 3. Recógelos y llévalos al Hotel Kramer – Juanjo ha reservado habitaciones también para vosotros los valencianos durante la semana del PI, para que nadie tenga que coger la moto después del Agua de Valencia.", "Kein Koffer für dich – du bist der Abholservice. Die Schweizer stehen irgendwo in der Halle: {0}. Sie winken mit einem „!“ (oder rauchen, oder schauen Autos an).": "Sin maleta para ti – tú eres el servicio de recogida. Los suizos están en algún lugar de la sala: {0}. Saludan con un «!» (o fuman, o miran coches).", "Band 3 dreht weiter. Deine Gäste warten in der Halle.": "La cinta 3 sigue girando. Tus invitados esperan en la sala.", "Tasche auf: Laptop, Ladegerät, ein Pullover. Juanjo hat gesagt: „Pack für eine Woche Hotel. Teambuilding.“ Das Zimmer hat Meerblick – wenn man sich weit aus dem Fenster lehnt.": "Bolsa abierta: portátil, cargador, un jersey. Juanjo dijo: «Prepara una semana de hotel. Team building.» La habitación tiene vistas al mar – si te asomas mucho por la ventana.", "Das ist dein Platz.": "Ese es tu sitio.", "Samstag, 8:15 – Taxi zum Flughafen …": "Sábado, 8:15 – taxi al aeropuerto …", "Die Schweizer zum Flughafen bringen …": "Llevando a los suizos al aeropuerto …", "{0} winkt den Schweizern nach {1} Tagen am Flughafen nach.": "{0} despide a los suizos en el aeropuerto tras {1} días.", "{0} fliegt nach {1} Tagen zurück.": "{0} vuelve tras {1} días.", "iOS-Entwickler": "Desarrollador iOS", "Tennis": "Tenis", "Zweimal die Woche Tennis, seit zwanzig Jahren. Vorhand wie ein Rennwagen, Rückhand wie ein Anhänger.": "Tenis dos veces por semana, desde hace veinte años. Derecha como un coche de carreras, revés como un remolque.", "Der Padel-Court beim Park? Padel ist Tennis für Leute, die keine Lust auf Laufen haben. Ich spiele trotzdem mit. Bring deinen Schläger – ach, Sergio hat welche.": "¿La pista de pádel junto al parque? El pádel es tenis para gente sin ganas de correr. Aun así juego. Trae tu raqueta – ah, Sergio tiene palas.", "Nadal hat auf Sand gewonnen, ich verliere auf Sand. Hartplatz. Immer Hartplatz.": "Nadal ganaba en tierra batida, yo pierdo en tierra batida. Pista dura. Siempre pista dura.", "Boxen": "Boxeo", "Dienstag und Donnerstag Boxtraining. Sandsack, Seil, Pratzen. Besser als jede Retrospektive.": "Martes y jueves entreno de boxeo. Saco, comba, manoplas. Mejor que cualquier retrospectiva.", "Boxen und Rauchen? Ja, ich weiss. Mein Trainer sagt das auch. Jede Woche.": "¿Boxeo y tabaco? Sí, lo sé. Mi entrenador también lo dice. Cada semana.", "Im Ring zählt nur die nächste Runde. Im Sprint auch. Deshalb bin ich PO geworden.": "En el ring solo cuenta el siguiente asalto. En el sprint también. Por eso me hice PO.", "Fridays for Future": "Fridays for Future", "Freitags bin ich in Leipzig auf der Demo. Darum: Zug statt Flieger, wenn es geht. Nach Valencia ging es nicht – 17 Stunden, sagt der Schalterbeamte.": "Los viernes estoy en la manifestación en Leipzig. Por eso: tren en vez de avión cuando se puede. A Valencia no se pudo – 17 horas, dice el taquillero.", "E-Bikes statt Autos, das ist für mich keine Roadmap, das ist der Grund, warum ich hier arbeite. Sag das Luigi nicht zu laut.": "Bicis eléctricas en vez de coches – para mí eso no es un roadmap, es la razón por la que trabajo aquí. No se lo digas a Luigi muy alto.", "Der Battery Pass ist Klimapolitik in einer JSON-Datei. Lukas versteht mich.": "El pasaporte de baterías es política climática en un archivo JSON. Lukas me entiende.", "Freitag ist Demo-Tag. Hier: Final-Tag. Auch okay.": "El viernes es día de manifestación. Aquí: día de la final. También vale.", "Padel heute Abend? Fast wie Tennis.": "¿Pádel esta noche? Casi como el tenis.", "Boxtraining fällt diese Woche aus. Dafür: Treppe statt Lift.": "Esta semana no hay entreno de boxeo. A cambio: escaleras en vez de ascensor.", "UX-Auge": "Ojo UX", "Elenas UX-Workshop mitgemacht": "Has participado en el taller UX de Elena", "Schichtenmodell": "Modelo de capas", "Carlos’ Architektur-Workshop mitgemacht": "Has participado en el taller de arquitectura de Carlos", "Mit Chris Meilensteine und Releases auf die Sprints gelegt": "Has colocado hitos y releases en los sprints con Chris", "Retro": "Retro", "Die PI-Retrospektive mitgemacht": "Has participado en la retrospectiva del PI", "Reproduzierbar": "Reproducible", "Mit Daniel über Testen und Dokumentation geredet": "Has hablado con Daniel de pruebas y documentación", "Hat für alles eine Liste. Auch für die Listen.": "Tiene una lista para todo. También para las listas.", "Schätzt Story Points in PS.": "Estima los story points en caballos.", "Die besten Ideen kommen auf dem Balkon.": "Las mejores ideas llegan en el balcón.", "Erstes PI Planning. 24 Folien. Noch nie geklingelt.": "Primer PI Planning. 24 diapositivas. Nunca ha llamado a un timbre.", "Kann die Batterieverordnung auswendig. Freiwillig.": "Se sabe el reglamento de baterías de memoria. Voluntariamente.", "Club Mate im Rucksack, SwiftUI im Herzen.": "Club Mate en la mochila, SwiftUI en el corazón.", "Morgens Wellen, nachmittags Roadmap.": "Olas por la mañana, roadmap por la tarde.", "Grillt besser, als er deployt. Und er deployt gut.": "Asa mejor de lo que despliega. Y despliega bien.", "Kennt 2000 CANopen-Indexe. Mindestens.": "Conoce 2000 índices CANopen. Como mínimo.", "Hat schon eine Idee, bevor du ausgeredet hast.": "Ya tiene una idea antes de que termines de hablar.", "Sagt wenig. Ihr Code sagt alles.": "Habla poco. Su código lo dice todo.", "Pipeline grün, Tortilla weg.": "Pipeline en verde, tortilla desaparecida.", "Hat Colba gegründet. Und die Klingel nie angeschrieben.": "Fundó Colba. Y nunca rotuló el timbre.", "Testet dreimal. Dann noch einmal.": "Prueba tres veces. Y luego otra.", "Baut, was Elena zeichnet. Meistens.": "Construye lo que Elena dibuja. Casi siempre.", "Drei Apps im Store, zwei davon gut.": "Tres apps en la store, dos de ellas buenas.", "Hat immer recht. Vor allem bei Buttons.": "Siempre tiene razón. Sobre todo con los botones.", "Refactort alles. Auch Bass-Riffs.": "Lo refactoriza todo. Hasta los riffs de bajo.", "Hat das SAFe-Buch gelesen. Das ganze.": "Se ha leído el libro de SAFe. Entero.", "60 Kilometer vor der Arbeit. Mit dem Velo.": "60 kilómetros antes del trabajo. En bici.", "Organisiert alles. Ausser die Klingel.": "Lo organiza todo. Menos el timbre.", "Daniel": "Daniel", "Tester · Dokumentation": "Tester · documentación", "Findet den Bug. Und dokumentiert ihn. Mit Screenshot.": "Encuentra el bug. Y lo documenta. Con captura.", "UX-Workshop": "Taller UX", "Architektur-Workshop": "Taller de arquitectura", "Roadmap-Workshop": "Taller de roadmap", "PI-Retrospektive": "Retrospectiva del PI", "mit {0} im Aufenthaltsraum": "con {0} en la sala común", "Ein Nachmittag für die App: Ich zeige euch sechs Stellen, an denen Nutzer gescheitert sind. Ihr sagt mir, was wir ändern. Keine Codes, keine Hexzahlen – Menschen.": "Una tarde para la app: os enseño seis puntos en los que los usuarios se han atascado. Vosotros me decís qué cambiamos. Sin códigos, sin hexadecimales – personas.", "Vier Schichten, ein Pfeil nach unten. UI oben, Infrastruktur unten, und nichts zeigt nach oben. Wer das verstanden hat, refactort nie wieder um drei Uhr nachts.": "Cuatro capas, una flecha hacia abajo. UI arriba, infraestructura abajo, y nada apunta hacia arriba. Quien lo entiende no vuelve a refactorizar a las tres de la madrugada.", "Die Roadmap ist ein Surfbrett: Richtung klar, Weg flexibel. Sechs Sprints, zehn Punkte – Meilensteine und Releases. Legt sie so, dass nichts vor seiner Voraussetzung kommt. Und die Demo zuletzt.": "El roadmap es una tabla de surf: dirección clara, camino flexible. Seis sprints, diez puntos – hitos y releases. Colocadlos de forma que nada vaya antes de su requisito. Y la demo al final.", "Bevor wir committen: Was lief gut, was lassen wir, was fangen wir an? Keep, Stop, Start. Robin, du darfst auch.": "Antes de comprometernos: ¿qué fue bien, qué dejamos, qué empezamos? Keep, Stop, Start. Robin, tú también puedes.", "Wir machen weiter, wenn du wieder da bist.": "Seguimos cuando vuelvas.", "Genau so. Ab morgen sind die Buttons 44 Pixel – und niemand sieht mehr 0x60A0.": "Exacto. Desde mañana los botones miden 44 píxeles – y nadie vuelve a ver 0x60A0.", "Nicht schlecht. Aber bitte: Nutzer sind keine Entwickler. Wir üben das.": "No está mal. Pero por favor: los usuarios no son desarrolladores. Lo practicaremos.", "Sauber geschichtet. Der Parser wird stolz auf euch sein, wenn er fertig ist.": "Bien estratificado. El parser estará orgulloso de vosotros cuando esté terminado.", "Ein paar Pfeile zeigen nach oben. Das rächt sich im dritten Sprint – ich hab es gesehen.": "Algunas flechas apuntan hacia arriba. Eso se paga en el tercer sprint – lo he visto.", "Das ist eine Roadmap: keine Release vor ihrem Meilenstein, die Demo zuletzt. Ich häng sie ins Büro.": "Eso es un roadmap: ninguna release antes de su hito, la demo al final. Lo cuelgo en la oficina.", "{0} Punkte liegen vor ihrer Voraussetzung oder zu dicht. So fahren wir gegen die Wand – nochmal im nächsten PI.": "{0} puntos están antes de su requisito o demasiado juntos. Así nos estrellamos – otra         <li>In der <a href="https://console.firebase.google.com/" style="color:var(--amber)">Firebase-Konsole</a> ein Projekt anlegen (oder das bestehende vom Wiehnachtsreisli nehmen) und unter <b>Build → Realtime Database</b> eine Datenbank erstellen (Standort z. B. <code>europe-west1</code>).</li>
        <li>Unter <b>Regeln</b> diesen Zweig ergänzen und veröffentlichen (andere Zweige bleiben, wie sie sind):
<pre>{
  "rules": {
    "${ROOT}": {
      "devices": {
        ".read": true,
        "$device": { ".write": true, ".validate": "$device.length &lt; 40" }
      }
    }
  }
}</pre></li>
        <li>Die Datenbank-URL (z. B. <code>https://mein-projekt-default-rtdb.europe-west1.firebasedatabase.app</code>) in <code>tracking.json</code> im Repo eintragen oder als Repo-Variable <code>TRACK_DB</code> setzen und neu bauen. Danach senden alle Spiele ihren Stand.</li>
      </ol>
      <p>Zum Ausprobieren kannst du die URL auch nur hier im Browser eintragen:</p>
      <form id="dbForm"><input id="dbIn" type="url" placeholder="https://…firebasedatabase.app" required aria-label="Datenbank-URL"><button type="submit">Verbinden</button></form>
    </section>`;
    $('#dbForm').onsubmit = (e) => { e.preventDefault(); DB = $('#dbIn').value.trim().replace(/\/+$/, ''); try { localStorage.setItem('pi-tracker-db', DB); } catch (er) {} load(); };
  }
  $('#reload').onclick = () => (DB ? load() : setup());
  setInterval(() => { if (data) render(); }, 30000);
  if (DB) load(); else setup();
})();
</script>
</body>
</html>
